<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canon Manual Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ CANON — Manual Governance Studio ============ */
:root{
  --bg:#F3F0E8; --bg2:#ECE7DC; --surface:#FFFFFF; --surface2:#FAF8F3; --ink:#14161B; --ink2:#3A3E48; --muted:#6E7280; --faint:#A3A6AE;
  --line:#E3DDD0; --line2:#EFEAE0;
  --accent:#FF5B1F; --accent-ink:#FFFFFF; --accent-soft:#FFE9DF;
  --teal:#0FA88A; --teal-soft:#DDF5EE;
  --blue:#2F6BFF; --blue-soft:#E3ECFF;
  --amber:#E79A00; --amber-soft:#FFF2D6;
  --red:#E5383B; --red-soft:#FDE4E4;
  --violet:#7B5CFF; --violet-soft:#ECE7FF;
  --side:#101217; --side-ink:#E9E5DA; --side-muted:#7D828F; --side-line:#1F232C; --side-hover:#1A1D25;
  --shadow:0 1px 2px rgba(20,22,27,.05),0 8px 24px -12px rgba(20,22,27,.12);
  --shadow-lg:0 24px 64px -20px rgba(20,22,27,.35);
  --r:14px; --r-sm:9px;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0C0E12; --bg2:#12151B; --surface:#151820; --surface2:#1A1E27; --ink:#ECE8DF; --ink2:#C9C5BB; --muted:#8C909C; --faint:#5B606C;
  --line:#262B36; --line2:#1F232C; --accent-soft:#3A1E12; --teal-soft:#0F2E28; --blue-soft:#14213F; --amber-soft:#33270B; --red-soft:#3A1517; --violet-soft:#241D44;
  --side:#08090C; --side-line:#191C24; --side-hover:#13161D; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark; }}
:root[data-theme="dark"]{
  --bg:#0C0E12; --bg2:#12151B; --surface:#151820; --surface2:#1A1E27; --ink:#ECE8DF; --ink2:#C9C5BB; --muted:#8C909C; --faint:#5B606C;
  --line:#262B36; --line2:#1F232C; --accent-soft:#3A1E12; --teal-soft:#0F2E28; --blue-soft:#14213F; --amber-soft:#33270B; --red-soft:#3A1517; --violet-soft:#241D44;
  --side:#08090C; --side-line:#191C24; --side-hover:#13161D; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
::selection{background:var(--accent);color:#fff}
.mono{font-family:var(--mono)}
.serif{font-family:var(--serif)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.small{font-size:12px} .xs{font-size:11px}
.row{display:flex;align-items:center;gap:8px} .row.wrap{flex-wrap:wrap} .col{display:flex;flex-direction:column;gap:8px}
.grow{flex:1;min-width:0} .right{margin-left:auto} .center{text-align:center}
.gap4{gap:4px}.gap12{gap:12px}.gap16{gap:16px}.gap24{gap:24px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}
.hide{display:none!important}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.lg{width:20px;height:20px} svg.i.sm{width:13px;height:13px}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;border-right:1px solid var(--side-line);overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 18px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:conic-gradient(from 200deg,var(--accent),#FFB01F,var(--teal),var(--accent));display:grid;place-items:center;color:#101217;font:700 17px var(--serif);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset}
.brand-name{font:600 19px var(--serif);letter-spacing:.2px}
.brand-sub{font-size:10.5px;color:var(--side-muted);letter-spacing:1.4px;text-transform:uppercase}
.nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--side-muted);padding:16px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;text-decoration:none;color:#BFBBB1;font-weight:500;cursor:pointer}
.nav a:hover{background:var(--side-hover);color:#fff}
.nav a.on{background:#1C2029;color:#fff;box-shadow:inset 2px 0 0 var(--accent)}
.nav a .cnt{margin-left:auto;font:600 11px var(--mono);background:var(--accent);color:#fff;border-radius:20px;padding:1px 7px}
.nav a .dot{width:8px;height:8px;border-radius:50%;flex:none}
.side-scroll{flex:1;overflow:auto}
.side-foot{padding:14px;border-top:1px solid var(--side-line)}
.side-foot .who{display:flex;align-items:center;gap:10px}
.side-foot select{width:100%;margin-top:10px;background:#171A21;border:1px solid var(--side-line);color:var(--side-ink);border-radius:8px;padding:7px 8px;font-size:12.5px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:12px 28px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;min-width:0}
.crumbs b{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.searchbtn{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px 7px 12px;color:var(--muted);cursor:pointer;min-width:220px}
.searchbtn kbd{margin-left:auto}
kbd{font:600 10.5px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--muted);background:var(--surface2)}
.iconbtn{position:relative;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink2)}
.iconbtn:hover{border-color:var(--faint)}
.iconbtn .pip{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font:700 10px/18px var(--mono);text-align:center;padding:0 4px;border:2px solid var(--bg)}
.menu-toggle{display:none}
#view{padding:28px;max-width:1500px;width:100%;margin:0 auto}

/* ---------- Primitives ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 13px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;transition:transform .08s,background .15s,border-color .15s}
.btn:hover{border-color:var(--faint)} .btn:active{transform:translateY(1px)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,var(--line))}
.btn.danger.fill{background:var(--red);color:#fff;border-color:var(--red)}
.btn.ghost{background:transparent;border-color:transparent} .btn.ghost:hover{background:var(--surface2);border-color:var(--line)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px} .btn.xs{padding:3px 7px;font-size:11.5px;border-radius:7px;gap:4px}
.btn[disabled]{opacity:.45;pointer-events:none}
.ai-btn{background:linear-gradient(135deg,#1A1033,#2A1650 50%,#4A1D2E);color:#fff;border-color:transparent;position:relative}
.ai-btn svg{color:#FFB38F}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card.pad{padding:20px} .card .hd{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line2)} .card .bd{padding:18px 20px}
.card h3,.h3{margin:0;font:600 15px var(--sans)}
.h1{font:500 34px/1.1 var(--serif);margin:0;letter-spacing:-.4px}
.h2{font:500 22px/1.2 var(--serif);margin:0}
.eyebrow{font:600 10.5px var(--sans);letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.pagehead{display:flex;align-items:flex-end;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.pagehead .grow p{margin:6px 0 0;color:var(--muted)}
.input,.select,.textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;transition:border-color .15s,box-shadow .15s}
.input:focus,.select:focus,.textarea:focus{border-color:var(--ink2);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.textarea{min-height:90px;resize:vertical;line-height:1.6}
label.lbl{display:block;font-weight:600;font-size:12px;color:var(--ink2);margin:0 0 6px}
.field{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;background:var(--surface2);border:1px solid var(--line);font-size:12px;font-weight:600;white-space:nowrap}
.chip.click{cursor:pointer} .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .x{cursor:pointer;opacity:.6} .chip .x:hover{opacity:1}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;font:600 11px var(--sans);white-space:nowrap;letter-spacing:.2px}
.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.plain:before{display:none}
.b-gray{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.b-blue{background:var(--blue-soft);color:var(--blue)} .b-amber{background:var(--amber-soft);color:var(--amber)}
.b-red{background:var(--red-soft);color:var(--red)} .b-green{background:var(--teal-soft);color:var(--teal)}
.b-violet{background:var(--violet-soft);color:var(--violet)} .b-orange{background:var(--accent-soft);color:var(--accent)}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font:700 10.5px var(--sans);color:#fff;flex:none;letter-spacing:.3px;box-shadow:0 0 0 2px var(--surface)}
.av.lg{width:36px;height:36px;font-size:13px} .av.sm{width:20px;height:20px;font-size:8.5px}
.av.empty{background:transparent;border:1.5px dashed var(--faint);color:var(--faint);box-shadow:none}
.avstack{display:flex}.avstack .av{margin-left:-6px}.avstack .av:first-child{margin-left:0}
.ring{--p:0;--c:var(--teal);width:38px;height:38px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line2) 0);display:grid;place-items:center;flex:none}
.ring:after{content:attr(data-v);width:30px;height:30px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:700 9.5px var(--mono)}
.ring.sm{width:24px;height:24px}.ring.sm:after{width:18px;height:18px;font-size:0;content:""}
.ring.lg{width:88px;height:88px}.ring.lg:after{width:72px;height:72px;font-size:18px}
.bar{height:6px;border-radius:6px;background:var(--line2);overflow:hidden}.bar>i{display:block;height:100%;border-radius:6px;background:var(--teal)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs a{padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px;white-space:nowrap;text-decoration:none}
.tabs a:hover{color:var(--ink)} .tabs a.on{color:var(--ink);border-color:var(--accent)}
.tabs a .n{font:600 10.5px var(--mono);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:0 6px}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg a{padding:5px 11px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--muted);cursor:pointer;text-decoration:none}
.seg a.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font:600 10.5px var(--sans);letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0} .tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--surface2)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty .h2{color:var(--ink);margin-bottom:6px}
.divider{height:1px;background:var(--line2);margin:16px 0}
.note{padding:12px 14px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:13px}
.note.warn{background:var(--amber-soft);border-color:transparent;color:var(--ink)} .note.info{background:var(--blue-soft);border-color:transparent}
.note.bad{background:var(--red-soft);border-color:transparent} .note.good{background:var(--teal-soft);border-color:transparent}

/* ---------- Dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:18px}
.kpi{padding:16px 18px;position:relative;overflow:hidden}
.kpi .v{font:500 34px/1 var(--serif);margin-top:10px;letter-spacing:-.5px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:6px}
.kpi .ic{position:absolute;right:14px;top:14px;width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.dash{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.span4{grid-column:span 4}.span5{grid-column:span 5}.span6{grid-column:span 6}.span7{grid-column:span 7}.span8{grid-column:span 8}.span12{grid-column:span 12}
.hero{background:var(--side);color:var(--side-ink);border-radius:18px;padding:26px 28px;display:grid;grid-template-columns:1.3fr 1fr;gap:24px;margin-bottom:18px;position:relative;overflow:hidden;border:1px solid var(--side-line)}
.hero:before{content:"";position:absolute;right:-120px;top:-160px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(255,91,31,.35),transparent 65%)}
.hero:after{content:"";position:absolute;right:120px;bottom:-200px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(15,168,138,.25),transparent 65%)}
.hero > *{position:relative;z-index:1}
.hero .h1{color:#fff}
.hero .muted{color:var(--side-muted)}
.pipeline{display:flex;gap:6px;align-items:stretch}
.pipe{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px}
.pipe .n{font:500 28px var(--serif);color:#fff}
.pipe .t{font-size:11px;color:var(--side-muted);text-transform:uppercase;letter-spacing:1.2px}
.pipe .ln{height:3px;border-radius:2px;margin-top:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.feed .it{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)} .feed .it:last-child{border:0}
.heat{display:grid;gap:4px}
.heat .cell{height:30px;border-radius:7px;display:grid;place-items:center;font:600 11px var(--mono)}
.matrix th,.matrix td{text-align:center} .matrix td:first-child,.matrix th:first-child{text-align:left}

/* ---------- Library ---------- */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.mcard{padding:0;cursor:pointer;transition:transform .15s,box-shadow .15s;overflow:hidden;display:flex;flex-direction:column}
.mcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.mcard .spine{height:6px}
.mcard .c{padding:18px 20px;flex:1}
.mcard .code{font:600 11px var(--mono);color:var(--muted);letter-spacing:.5px}
.mcard .t{font:500 21px/1.2 var(--serif);margin:6px 0 10px}
.mcard .f{display:flex;align-items:center;gap:10px;padding:12px 20px;border-top:1px solid var(--line2);background:var(--surface2)}
.stagebar{display:flex;gap:3px;margin-top:14px}.stagebar i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.stagebar i.done{background:var(--ink)} .stagebar i.cur{background:var(--accent)}

/* ---------- Workspace ---------- */
.ws-head{display:flex;gap:18px;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;gap:0;margin:8px 0 20px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;overflow-x:auto}
.stepper,.tabs{scrollbar-width:none}.stepper::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.step{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;font-weight:600;font-size:12.5px;color:var(--muted);white-space:nowrap}
.step .n{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:700 10.5px var(--mono)}
.step.done{color:var(--ink)} .step.done .n{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.step.cur{background:var(--accent-soft);color:var(--accent)} .step.cur .n{border-color:var(--accent);background:var(--accent);color:#fff}
.step-sep{width:24px;height:1.5px;background:var(--line);flex:none}
.ws{display:grid;grid-template-columns:300px minmax(0,1fr) 320px;gap:16px;align-items:start}
.tree{position:sticky;top:76px;max-height:calc(100vh - 96px);display:flex;flex-direction:column}
.tree .list{overflow:auto;padding:8px}
.tn{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13px;position:relative}
.tn:hover{background:var(--surface2)} .tn.on{background:var(--accent-soft)}
.tn .num{font:600 11.5px var(--mono);color:var(--muted);min-width:34px}
.tn.on .num{color:var(--accent)}
.tn .tt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tn.l0 .tt{font-weight:700}
.tn.dim{opacity:.45}
.sdot{width:8px;height:8px;border-radius:50%;flex:none}
.tn .cf{color:var(--red)}
.docpane{min-width:0}
.clause-head{padding:22px 26px 18px;border-bottom:1px solid var(--line2)}
.clause-num{font:600 13px var(--mono);color:var(--accent);letter-spacing:.5px}
.clause-title{font:500 28px/1.2 var(--serif);border:0;background:transparent;width:100%;outline:none;padding:2px 0;margin-top:4px;letter-spacing:-.3px}
.clause-title:focus{box-shadow:0 2px 0 var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:18px;margin-top:14px}
.meta .m{display:flex;flex-direction:column;gap:4px}
.meta .m .k{font:600 10px var(--sans);letter-spacing:1.3px;text-transform:uppercase;color:var(--faint)}
.sect{padding:20px 26px;border-bottom:1px solid var(--line2)}
.sect:last-child{border-bottom:0}
.sect-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sect-h .t{font:700 11px var(--sans);letter-spacing:1.4px;text-transform:uppercase;color:var(--ink2)}
.docbody{font:400 16px/1.75 var(--serif);color:var(--ink);white-space:pre-wrap;word-wrap:break-word;min-height:60px}
.docbody.empty-b{color:var(--faint);font-style:italic}
.doced{font:400 15.5px/1.75 var(--serif);min-height:200px;border-radius:10px;background:var(--surface2)}
mark.cm{background:color-mix(in srgb,var(--amber) 28%,transparent);color:inherit;border-bottom:2px solid var(--amber);border-radius:2px;cursor:pointer;padding:0 1px}
mark.cm.dept{background:color-mix(in srgb,var(--violet) 22%,transparent);border-color:var(--violet)}
mark.cm.act{background:color-mix(in srgb,var(--amber) 55%,transparent)}
mark.cf{background:transparent;color:inherit;text-decoration:underline wavy var(--red);text-decoration-thickness:1.5px;text-underline-offset:4px;cursor:help}
.fab-comment{position:absolute;z-index:60;display:flex;gap:4px;background:var(--ink);color:var(--bg);border-radius:10px;padding:4px;box-shadow:var(--shadow-lg)}
.fab-comment button{background:transparent;border:0;color:inherit;padding:6px 10px;border-radius:7px;cursor:pointer;display:flex;gap:6px;align-items:center;font-weight:600;font-size:12.5px}
.fab-comment button:hover{background:rgba(255,255,255,.12)}
.reqs{display:grid;gap:8px}
.req{display:grid;grid-template-columns:1fr auto auto auto auto;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}
.req .lim{font:700 18px var(--serif)}
.req .ty{font:700 10px var(--mono);padding:3px 7px;border-radius:5px;letter-spacing:.8px}
.ty.max{background:var(--red-soft);color:var(--red)} .ty.min{background:var(--teal-soft);color:var(--teal)}
.points{counter-reset:p;display:grid;gap:6px;margin:0;padding:0;list-style:none}
.points li{counter-increment:p;display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:9px;background:var(--surface2);border:1px solid var(--line2)}
.points li:before{content:counter(p,decimal-leading-zero);font:700 11px/22px var(--mono);color:var(--accent);flex:none}
.points li .tx{flex:1}
.timeline{position:relative;padding-left:22px}
.timeline:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--accent),var(--teal))}
.tl{position:relative;padding:4px 0 14px}
.tl:before{content:"";position:absolute;left:-20px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2.5px solid var(--accent)}
.tl .when{font:700 11px var(--mono);color:var(--accent);letter-spacing:.5px}
.tl .what{font-weight:600}
.rail{position:sticky;top:76px;max-height:calc(100vh - 96px);display:flex;flex-direction:column}
.rail .list{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
.cmt{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);transition:box-shadow .2s,border-color .2s;cursor:pointer}
.cmt.flash,.cmt:hover{border-color:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 20%,transparent)}
.cmt.resolved{opacity:.55}
.cmt .q{font:italic 13px/1.5 var(--serif);border-left:3px solid var(--amber);padding:2px 0 2px 9px;margin:8px 0;color:var(--ink2)}
.cmt.dept .q{border-color:var(--violet)}
.cmt .rep{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;font-size:13px}
.cfc{border:1px solid color-mix(in srgb,var(--red) 30%,var(--line));background:color-mix(in srgb,var(--red) 4%,var(--surface));border-radius:12px;padding:12px;cursor:pointer}
.cfc .q{font:italic 13px/1.5 var(--serif);border-left:3px solid var(--red);padding:2px 0 2px 9px;margin:8px 0}

/* ---------- Approval chain ---------- */
.chain{display:flex;flex-direction:column;gap:0}
.link{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:start;position:relative;padding-bottom:18px}
.link:not(:last-child):before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;background:var(--line)}
.link .node{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:700 13px var(--mono);border:2px solid var(--line);background:var(--surface)}
.link.approved .node{background:var(--teal);border-color:var(--teal);color:#fff}
.link.pending .node{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.link.returned .node{background:var(--red);border-color:var(--red);color:#fff}
.link.skipped .node{background:var(--surface2);border-style:dashed;color:var(--faint)}

/* ---------- Book ---------- */
.book-wrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;align-items:start}
.book-toc{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto;padding:16px}
.book-toc a{display:flex;gap:8px;padding:4px 6px;border-radius:6px;font-size:12.5px;text-decoration:none;color:var(--ink2);cursor:pointer}
.book-toc a:hover{background:var(--surface2)} .book-toc a .n{font:600 11px var(--mono);color:var(--muted);min-width:36px}
.book-toc a.l0{font-weight:700;margin-top:6px;color:var(--ink)}
.paper{background:#FFFDF8;color:#1C1D21;border-radius:6px;box-shadow:0 1px 0 #e9e3d6,0 30px 60px -30px rgba(40,30,10,.35);max-width:860px;margin:0 auto;position:relative}
:root[data-theme="dark"] .paper{background:#FBF8F1}
.paper .pg{padding:64px 72px}
.cover{min-height:640px;display:flex;flex-direction:column;background:linear-gradient(160deg,#121419 0%,#1F1A22 60%,#3A1A12 100%);color:#F2EEE5;border-radius:6px 6px 0 0;position:relative;overflow:hidden}
.cover:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 70px,rgba(255,255,255,.03) 70px 71px)}
.cover .band{position:absolute;left:0;top:0;bottom:0;width:14px;background:var(--accent)}
.cover .ct{font:400 54px/1.04 var(--serif);letter-spacing:-1px;margin:18px 0}
.paper h2.ch{font:500 30px var(--serif);border-bottom:2px solid #1C1D21;padding-bottom:10px;margin:48px 0 18px;display:flex;gap:16px;align-items:baseline}
.paper h2.ch .n{font:600 16px var(--mono);color:var(--accent)}
.paper h3.cl{font:600 18px var(--serif);margin:28px 0 8px;display:flex;gap:12px;align-items:baseline}
.paper h3.cl .n{font:600 13px var(--mono);color:#7a6f63}
.paper h4.cl{font:600 15.5px var(--serif);margin:20px 0 6px;display:flex;gap:12px;align-items:baseline}
.paper h4.cl .n{font:600 12px var(--mono);color:#7a6f63}
.paper p.bt{font:400 15px/1.8 var(--serif);margin:0 0 10px;white-space:pre-wrap;color:#2a2b30}
.paper .lims{border:1px solid #ddd5c4;border-radius:8px;margin:10px 0 12px;overflow:hidden}
.paper .lims table{width:100%;border-collapse:collapse;font-size:13px}
.paper .lims th{background:#F3EEE3;text-align:left;padding:7px 12px;font:700 10px var(--sans);letter-spacing:1.2px;text-transform:uppercase;color:#6d6457}
.paper .lims td{padding:7px 12px;border-top:1px solid #ece5d6}
.paper .na{border:1.5px dashed #c9bfae;border-radius:8px;padding:10px 14px;color:#7a6f63;font-style:italic;margin:10px 0}
.paper .var{background:#FFF1E8;border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 6px 6px 0;margin:8px 0;font-size:13.5px}
.paper .tight{color:#C2410C;font-weight:700}
.paper .pts{margin:6px 0 12px;padding-left:20px;font:15px/1.7 var(--serif)}
.paper .acts{display:flex;flex-direction:column;gap:6px;margin:8px 0 14px}
.paper .acts .a{display:grid;grid-template-columns:90px 1fr;gap:12px;font-size:13.5px;padding:6px 0;border-bottom:1px dotted #ddd5c4}
.paper .acts .a b{font:700 11.5px var(--mono);color:var(--accent)}
.sig{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.sig .s{border:1px solid #ddd5c4;border-radius:8px;padding:12px;font-size:12.5px}
.sig .s .sg{font:italic 20px 'Fraunces',serif;color:#253;margin:8px 0 2px;min-height:26px}

/* ---------- Overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,11,14,.55);backdrop-filter:blur(3px);z-index:100;display:grid;place-items:center;padding:20px;animation:fade .15s}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);width:min(640px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;animation:pop .18s cubic-bezier(.2,.9,.3,1.2)}
.modal.wide{width:min(880px,100%)}
.modal .mh{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line2)}
.modal .mh .h2{font-size:20px}
.modal .mb{padding:20px 22px;overflow:auto}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line2);background:var(--surface2);border-radius:0 0 18px 18px}
@keyframes fade{from{opacity:0}} @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.toasts{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;box-shadow:var(--shadow-lg);display:flex;gap:10px;align-items:center;font-weight:500;animation:pop .2s;max-width:420px}
.toast.bad{background:var(--red);color:#fff} .toast.good{background:var(--teal);color:#fff}
.drop{position:absolute;right:0;top:44px;width:400px;max-height:520px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);z-index:50}
.ntf{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line2);cursor:pointer;text-align:left}
.ntf:hover{background:var(--surface2)} .ntf.unread{background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.ntf .nd{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none}
.cmdk{width:min(620px,100%);align-self:start;margin-top:10vh}
.cmdk input{border:0;border-bottom:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px 20px;font-size:16px;background:transparent;width:100%;outline:none}
.cmdk .res{max-height:420px;overflow:auto;padding:8px}
.cmdk .r{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:9px;cursor:pointer}
.cmdk .r.on,.cmdk .r:hover{background:var(--surface2)}
.ai-glow{position:relative;border-radius:14px;padding:1.5px;background:linear-gradient(120deg,var(--accent),var(--violet),var(--teal),var(--accent));background-size:300% 300%;animation:glow 6s linear infinite}
.ai-glow > .inner{background:var(--surface);border-radius:13px}
@keyframes glow{to{background-position:300% 0}}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.thinking{display:flex;flex-direction:column;align-items:center;gap:14px;padding:40px}
.orb{width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--accent),var(--violet),var(--teal),var(--accent));animation:sp 1.6s linear infinite;filter:blur(1px);position:relative}
.orb:after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--surface)}
.preview-tree .pt{padding:6px 10px;border-radius:8px;display:flex;gap:10px} .preview-tree .pt:hover{background:var(--surface2)}
.wizard-types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wtype{border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;background:var(--surface)}
.wtype.on{border-color:var(--accent);background:var(--accent-soft)}
.wtype .t{font-weight:700;margin-top:6px}
.mode{border:1.5px solid var(--line);border-radius:16px;padding:22px;cursor:pointer;background:var(--surface);transition:border-color .15s,transform .15s}
.mode:hover{transform:translateY(-2px)} .mode.on{border-color:var(--accent)}

@media print{
  .side,.top,.book-toc,.noprint,.toasts{display:none!important}
  .app{display:block} #view{padding:0;max-width:none} .book-wrap{display:block}
  .paper{box-shadow:none;max-width:none} body{background:#fff}
  .cover{-webkit-print-color-adjust:exact;print-color-adjust:exact;page-break-after:always}
  h2.ch{page-break-before:always}
}
@media (max-width:1280px){ .ws{grid-template-columns:260px minmax(0,1fr)} .rail{grid-column:1 / -1;position:static;max-height:none} .kpis{grid-template-columns:repeat(3,1fr)} }
@media (max-width:980px){
  .app{grid-template-columns:1fr} .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:90;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none} .menu-toggle{display:grid}
  .ws,.book-wrap{grid-template-columns:1fr} .tree,.book-toc{position:static;max-height:320px}
  .dash > *{grid-column:span 12!important} .hero{grid-template-columns:1fr} .searchbtn{min-width:0} .searchbtn span{display:none}
}
@media (max-width:640px){
  #view{padding:16px} .top{padding:10px 16px} .kpis{grid-template-columns:repeat(2,1fr)} .grid2,.grid3,.wizard-types{grid-template-columns:1fr}
  .paper .pg{padding:32px 22px} .cover .ct{font-size:36px} .h1{font-size:26px} .drop{position:fixed;left:12px;right:12px;width:auto;top:60px}
  .req{grid-template-columns:1fr auto auto}
}

/* =================== v2: Studio editor =================== */
:root{--doc:'Source Serif 4',Georgia,'Times New Roman',serif;--sheet:#FFFEFB;--desk:#E4DED2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sheet:#151921;--desk:#07080B}}
:root[data-theme="dark"]{--sheet:#151921;--desk:#07080B}
.flip{transform:scaleX(-1)}
.ws-head .h1{font-size:28px}
.ws-head{margin-bottom:12px}
.studio{display:grid;grid-template-columns:272px minmax(0,1fr);gap:20px;align-items:start}
.outline{position:sticky;top:76px;max-height:calc(100vh - 92px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.ol-head{padding:14px;border-bottom:1px solid var(--line2)}
.ol-close,.ol-btn,.ol-scrim{display:none}
.ol-list{overflow:auto;padding:6px 6px 14px}
.on2{display:flex;align-items:center;gap:5px;padding:2px 6px;border-radius:8px;font-size:13px}
.on2:hover{background:var(--surface2)} .on2.sel{background:var(--accent-soft)}
.tw{width:18px;height:18px;border:0;background:none;display:grid;place-items:center;color:var(--muted);cursor:pointer;flex:none;padding:0}
.tw svg{transition:transform .15s} .tw.open svg{transform:rotate(90deg)}
.ol-link{display:flex;gap:8px;flex:1;min-width:0;cursor:pointer;padding:5px 0;text-decoration:none}
.ol-link .num{font:600 11.5px var(--mono);color:var(--muted);min-width:30px}
.on2.sel .num{color:var(--accent)}
.ol-link .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.on2.d0 .tt{font-weight:700}
.flag{font:700 10px var(--mono);display:inline-flex;align-items:center;flex:none} .flag.red{color:var(--red)} .flag.amber{color:var(--amber);background:var(--amber-soft);padding:0 5px;border-radius:6px}
.canvas{min-width:0}
.sbar{position:sticky;top:61px;z-index:20;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;box-shadow:var(--shadow)}
.sb-crumb{display:flex;align-items:center;gap:6px;font-size:13px;min-width:120px;overflow:hidden;white-space:nowrap}
.sb-crumb a{color:var(--muted);text-decoration:none;font:600 12px var(--mono)} .sb-crumb span{color:var(--faint)} .sb-crumb b{overflow:hidden;text-overflow:ellipsis}
.cnt2{font:700 10px var(--mono);background:var(--amber);color:#fff;border-radius:8px;padding:0 5px;margin-left:3px} .cnt2.red{background:var(--red)}
details.menu{position:relative} details.menu summary{list-style:none} details.menu summary::-webkit-details-marker{display:none}
.menu-pop{position:absolute;right:0;top:38px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;min-width:190px;z-index:40;display:flex;flex-direction:column}
.menu-pop button{display:flex;gap:8px;align-items:center;background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left;font-size:13px}
.menu-pop button:hover{background:var(--surface2)} .menu-pop button.danger{color:var(--red)}
.cgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
.cgrid.review{grid-template-columns:minmax(0,1fr) 340px}
.sheetcol{min-width:0}
.wsheet{background:var(--sheet);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:44px 52px 52px;max-width:880px;margin:0 auto}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin:0 auto 12px;max-width:880px;font-size:13px;flex-wrap:wrap}
.banner.bad{background:var(--red-soft);border-color:transparent} .banner.warn{background:var(--amber-soft);border-color:transparent}
.blk{padding:26px 0 26px;border-top:1px solid var(--line2)}
.blk.root{border-top:0;padding-top:0}
.b-head{display:flex;gap:12px;align-items:baseline}
.b-num{font:600 13px var(--mono);color:var(--accent);flex:none;min-width:46px}
.b-title{font:500 21px/1.3 var(--serif);border:0;background:transparent;width:100%;resize:none;outline:none;padding:0;color:var(--ink);overflow:hidden;display:block}
.root .b-title{font-size:30px;letter-spacing:-.3px} .lv2 .b-title,.lv3 .b-title{font-size:18px}
textarea.b-title{border-radius:4px} textarea.b-title:focus{box-shadow:0 2px 0 var(--accent)}
.props{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px 58px}
.pchip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px 0 9px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);font:600 12px var(--sans);color:var(--ink2);cursor:pointer;text-decoration:none;white-space:nowrap}
.pchip:has(.av){padding-left:3px} .pchip[disabled]{cursor:default} .pchip.ghost{background:transparent} .pchip.red{color:var(--red);background:var(--red-soft);border-color:transparent}
button.pchip:not([disabled]):hover{border-color:var(--faint)}
.pchip.st i{width:8px;height:8px;border-radius:50%;background:var(--sc)}
.b-text{display:block;border:0;outline:none;resize:none;background:transparent;font:400 17px/1.8 var(--doc);color:var(--ink);padding:10px 14px;margin-left:44px;width:calc(100% - 44px);border-radius:10px;min-height:96px;overflow:hidden;transition:background .15s,box-shadow .15s}
.b-text:hover{background:var(--surface2)} .b-text:focus{background:var(--surface2);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 45%,transparent)}
.b-text::placeholder{color:var(--faint);font-style:italic}
.b-read{font:400 17px/1.8 var(--doc);white-space:pre-wrap;padding:0 14px;margin-left:44px;color:var(--ink)}
.b-read.empty-b{color:var(--faint);font-style:italic;font-size:15px}
.wsheet.review .b-read{cursor:text}
.b-tools{display:flex;gap:4px;align-items:center;margin:6px 0 0 58px;flex-wrap:wrap}
.tbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid transparent;background:transparent;color:var(--muted);font:600 12px var(--sans);padding:4px 8px;border-radius:7px;cursor:pointer;white-space:nowrap}
.tbtn:hover{background:var(--surface2);color:var(--ink);border-color:var(--line)} .tbtn.ai{color:var(--violet)} .tbtn.right{margin-left:auto}
.extras{margin:16px 0 0 58px;display:flex;flex-direction:column;gap:12px}
.addrow{display:flex;flex-wrap:wrap;gap:2px}
.xbox{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.xh{display:flex;align-items:center;gap:8px;padding:8px 12px;font:700 10.5px var(--sans);letter-spacing:1.1px;text-transform:uppercase;color:var(--ink2);background:var(--surface2);border-bottom:1px solid var(--line2);flex-wrap:wrap}
.xh .xs{text-transform:none;letter-spacing:0;font-weight:500}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line2);font-size:14px;flex-wrap:wrap}
.lrow:last-child{border-bottom:0}
.lrow.ed{padding:6px 8px}
.lctl{display:flex;gap:4px;align-items:center;margin-left:auto}
.lin{border:1px solid transparent;background:transparent;border-radius:7px;padding:6px 8px;outline:none;font-size:13.5px;min-width:0;color:var(--ink)}
.lin:hover{border-color:var(--line)} .lin:focus{border-color:var(--ink2);background:var(--surface)}
.lin.num{width:72px;font-family:var(--mono);text-align:right} .lin.unit{width:92px} .lin.grow{flex:1;min-width:180px}
.tpill{font:700 10.5px var(--mono);padding:4px 8px;border-radius:6px;border:0;letter-spacing:.6px}
button.tpill{cursor:pointer} .tpill.max{background:var(--red-soft);color:var(--red)} .tpill.min{background:var(--teal-soft);color:var(--teal)}
.lval{font:600 18px var(--serif)} .lunit{color:var(--muted);font-size:13px;min-width:56px}
.plist{margin:0;padding:6px 12px 8px 38px} .plist li{padding:3px 0;font-size:14.5px;font-family:var(--doc)} .plist li::marker{color:var(--accent);font:700 12px var(--mono)}
.plist li .lin{width:calc(100% - 36px);font-family:var(--doc);font-size:14.5px}
.tline{padding:4px 12px 8px}

.onode.root{max-width:320px;background:var(--ink);color:var(--bg);border-color:var(--ink);border-top-color:var(--sc)} .onode.root .os{color:color-mix(in srgb,var(--bg) 60%,transparent)}
.onode .ot{font-weight:800;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .onode .os{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.onode .opct{font:500 24px var(--serif);color:var(--sc)}

/* breaches */

.click-row{cursor:pointer;border-radius:8px;padding:2px 4px;margin:-2px -4px} .click-row:hover{background:var(--surface2)}
/* heatmap */
table.heat2{border-collapse:separate;border-spacing:4px;width:100%;min-width:760px}
.heat2 th{padding:0 0 4px} .heat2 td.hn{font-weight:700;font-size:12.5px;white-space:nowrap;padding-right:8px}

@media (max-width:1100px){ .cc-hero{grid-template-columns:1fr auto} .cc-stats{grid-column:1 / -1;grid-template-columns:repeat(4,1fr)} .cc-spark{grid-column:auto / span 4} }
@media (max-width:760px){ .cc-hero{grid-template-columns:1fr;padding:20px} .cc-gauge{order:-1} .cc-stats{grid-template-columns:1fr 1fr} .cc-spark{grid-column:1 / -1}
  .org{min-width:0} .org ul{flex-direction:column;padding-top:10px} .org li{padding:10px 0 0 !important} .org li::before,.org li::after,.org ul ul::before,.oleaves:before{display:none} .onode,.oleaves .onode,.onode.root{max-width:none} .oleaves{padding-left:18px;border-left:2px solid var(--line);margin-top:8px} }
.sheet.cover:before{display:none}

/* =================== v4: Safety+ house style (navy · gold · Poppins) =================== */
:root,:root[data-theme="light"]{
  --bg:#F3F4F7; --bg2:#ECEEF2; --surface:#FFFFFF; --surface2:#F6F7F9; --ink:#1B2540; --ink2:#3A4560; --muted:#6B7280; --faint:#A3A9B4;
  --line:#E4E7EC; --line2:#EEF0F3; --accent:#B8925A; --accent-soft:#F6EEE2; --navy:#1C2B4A; --navy2:#24375E;
  --teal:#16A34A; --teal-soft:#E7F7EE; --blue:#4F46E5; --blue-soft:#EEEFFE; --amber:#C98A12; --amber-soft:#FEF4E2; --red:#DC3D3D; --red-soft:#FFF0F0; --violet:#9333EA; --violet-soft:#F4ECFE;
  --sans:'Poppins',system-ui,'Segoe UI',sans-serif; --serif:'Poppins',system-ui,sans-serif;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px -6px rgba(16,24,40,.08); --shadow-lg:0 20px 48px -18px rgba(16,24,40,.28);
  --r:12px; --sheet:#FFFFFF; --desk:#E7E9EE; color-scheme:light;
}
:root[data-theme="dark"]{ --bg:#0E1420; --bg2:#121A28; --surface:#162033; --surface2:#1B263B; --ink:#E8ECF4; --ink2:#C3CAD8; --muted:#8C96AA; --faint:#5D677B; --line:#26314A; --line2:#1F2A40;
  --accent:#C9A46C; --accent-soft:#3A2F1F; --navy:#0B1222; --navy2:#16223A; --teal-soft:#123425; --blue-soft:#1E2150; --amber-soft:#3A2D10; --red-soft:#3D1A1C; --violet-soft:#2E1B47;
  --sans:'Poppins',system-ui,sans-serif; --serif:'Poppins',system-ui,sans-serif; --sheet:#172235; --desk:#0A0F18; color-scheme:dark; }
body{font-family:var(--sans);font-size:13.5px;letter-spacing:.05px}
.h1{font:700 30px/1.15 var(--sans);letter-spacing:-.4px;color:var(--ink)}
.h2{font:600 20px/1.25 var(--sans);letter-spacing:-.2px}
.eyebrow{font-weight:600;letter-spacing:1.2px}
.mono{font-family:var(--mono)}

/* ---------- shell ---------- */
.app{grid-template-columns:290px minmax(0,1fr)}
.side{background:var(--surface);color:var(--ink);border-right:1px solid var(--line);box-shadow:none}
.brandbar{height:76px;flex:none;background:var(--navy);display:flex;align-items:center;gap:12px;padding:0 16px;color:#fff}
.bm{width:40px;height:40px;border:1.6px solid rgba(255,255,255,.85);border-radius:11px;display:grid;place-items:center;flex:none}
.bm svg{width:20px;height:20px} .bm-img{max-width:44px;max-height:44px;border-radius:8px;background:#fff;padding:3px;object-fit:contain}
.brandbar .bt{font:600 13.5px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .brandbar .bs{font-size:10.5px;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandbar .dd{width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.28);border:0;color:#fff;display:grid;place-items:center;flex:none;cursor:pointer}
.side-body{flex:1;display:grid;grid-template-columns:72px minmax(0,1fr);min-height:0}
.navrail{display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px 0;border-right:1px solid var(--line2)}
.navrail a{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:var(--ink2);position:relative;transition:background .15s}
.navrail a svg{width:20px;height:20px} .navrail a:hover{background:var(--surface2)}
.navrail a.on{background:var(--accent);color:#fff;box-shadow:0 8px 16px -8px rgba(184,146,90,.9)}
.navrail .rb{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--surface)}
.panel{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.panel-title{font:600 15px/1.3 var(--sans);color:var(--ink);padding:16px 16px 10px}
.panel nav{flex:1;overflow:auto}
.panel nav a{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:13px;color:var(--ink2);text-decoration:none;position:relative}
.panel nav a svg{color:var(--accent);width:17px;height:17px}
.panel nav a:hover{background:var(--surface2)} .panel nav a.on{background:var(--bg);color:var(--ink);font-weight:600}
.panel nav a.on:after{content:"";position:absolute;right:0;top:5px;bottom:5px;width:3px;border-radius:3px 0 0 3px;background:var(--accent)}
.panel nav a.sub{padding:7px 16px;font-size:12.5px} .panel nav a .dot{width:7px;height:7px;border-radius:50%;flex:none}
.panel nav .cnt{font:600 10.5px var(--sans);background:var(--red);color:#fff;border-radius:10px;padding:1px 7px}
.plabel{font:600 10px var(--sans);letter-spacing:1.2px;text-transform:uppercase;color:var(--faint);padding:18px 16px 6px}
.panel-foot{border-top:1px dashed var(--line);padding:12px 14px}
.panel-foot select{width:100%;margin-top:4px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:7px 8px;font-size:12.5px;color:var(--ink)}
.pf-brand{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--teal)} .pf-brand b{font:700 12px var(--sans);color:var(--ink);letter-spacing:.6px}
.top{height:76px;background:var(--surface);border-bottom:1px solid var(--line);padding:0 24px;gap:12px;backdrop-filter:none}
.pill-alert,.pill-info{display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;border-radius:10px;font-size:12.5px;text-decoration:none;min-width:0;flex:1;max-width:340px}
.pill-alert span,.pill-info span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill-alert{border:1.5px solid #F09B9B;background:var(--red-soft);color:var(--red)} .pill-alert.ok{border-color:#9BD8B4;background:var(--teal-soft);color:var(--teal)}
.pill-info{background:var(--bg2);color:var(--ink2)}
.sqbtn{width:44px;height:44px;border-radius:10px;background:var(--bg2);border:0;display:grid;place-items:center;color:var(--ink);cursor:pointer;position:relative;flex:none}
.sqbtn:hover{background:var(--line)}
.sqbtn .pip{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font:700 10px/18px var(--sans);text-align:center;padding:0 4px;border:2px solid var(--surface)}
.menu-toggle{display:none}
.ubox{display:flex;align-items:center;gap:10px;margin-left:4px}
.uav{width:42px;height:42px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:600 13px var(--sans);position:relative;flex:none}
.uav i{position:absolute;right:0;bottom:1px;width:11px;height:11px;border-radius:50%;background:#22C55E;border:2px solid var(--surface)}
.un b{display:block;font:600 14px var(--sans);color:var(--ink);white-space:nowrap} .un span{font-size:11.5px;color:var(--muted);white-space:nowrap}
.drop{top:52px}
#view{padding:28px 28px 40px}

/* ---------- primitives ---------- */
.btn{border-radius:9px;font-family:var(--sans);font-weight:600;font-size:12.5px}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 14px -8px rgba(184,146,90,.9)} .btn.acc:hover{filter:brightness(.96)}

.ai-btn{background:linear-gradient(135deg,var(--navy),var(--navy2));border-color:transparent;color:#fff} .ai-btn svg{color:#E3C08D}
.card{border-radius:12px;border-color:var(--line);box-shadow:var(--shadow)}

:root[data-theme="dark"] .p-lav{background:#23215A;color:#A5A1FF} :root[data-theme="dark"] .p-pur{background:#2E1B47;color:#D2A8FF} :root[data-theme="dark"] .p-amb{background:#3A2D10;color:#F0C46B} :root[data-theme="dark"] .p-grn{background:#123425;color:#5BD38C} :root[data-theme="dark"] .p-tan{color:#E3C08D}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.seg{border-radius:9px} .seg a{font-weight:500}
.tabs a{font-weight:500} .tabs a.on{color:var(--ink);font-weight:600;border-color:var(--accent)}
.input,.select,.textarea{border-radius:9px}
.av{font-family:var(--sans);font-weight:600}
.tbl th{font:600 12px var(--sans);letter-spacing:0;text-transform:none;color:var(--ink);background:var(--surface)}
.tbl td{font-size:13px}
.srt{width:12px;height:12px;color:var(--faint);vertical-align:-2px}
.nowrap{white-space:nowrap}

.ltable .tbl td{padding:13px 10px} .ltable .tbl th{padding:13px 8px} .ltable .tbl td{padding:13px 8px;font-size:12.5px} .ltable .acts .ab{width:26px}
.acts{text-align:right} .acts .ab{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;border:0;background:transparent;color:var(--ink);cursor:pointer;margin-left:0}

.pagehead{align-items:center}
.pagehead .grow p{font-size:13px}
.kpi .v{font:700 30px var(--sans);letter-spacing:-.5px}
.kpi .ic{border-radius:10px}

.tn.on,.on2.sel{background:var(--accent-soft)}
.stagebar i.cur{background:var(--accent)} .stagebar i.done{background:var(--navy)}
.mode.on,.wtype.on{border-color:var(--accent);background:var(--accent-soft)}
.cnt2{background:var(--accent)}
.toast{background:var(--navy);color:#fff;font-family:var(--sans)}

/* =================== v5: change requests & diff =================== */

.sbh{font:600 10.5px var(--sans);letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
table.dtab{width:100%;border-collapse:collapse;font-size:13px} .dtab th{text-align:left;font:600 11.5px var(--sans);color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)} .dtab td{padding:8px;border-bottom:1px solid var(--line2)}

        { t:'Normative References', b:`The following documents are referenced in this manual and apply to the extent indicated:\n${refs.map(r=>'• '+r).join('\n')}\nWhere local legislation is more stringent, the more stringent requirement applies.` },
        { t:'Terms & Definitions', b:`Terms used follow ISO 45001 clause 3. Key terms: Incident — occurrence arising out of work that could or does result in injury and ill health. Hazard — source with a potential to cause injury and ill health. Worker — person performing work or work-related activities under the control of the organization.` },

      { t:'Context of the Organization', b:`${co} determines the external and internal issues relevant to its purpose that affect its ability to achieve the intended outcomes of the OH&S management system.`, c:[

      { t:'Leadership & Worker Participation', b:`Top management shall demonstrate leadership and commitment with respect to the OH&S management system and take overall responsibility and accountability for preventing work-related injury and ill health.`, c:[
        { t:'Leadership & Commitment', b:`Top management shall ensure resources are available, protect workers from reprisals when reporting incidents, hazards, risks and opportunities, and promote a positive safety culture.`, p:['Conduct documented leadership safety walks','Allocate OH&S budget in the annual plan','Communicate the importance of effective OH&S management'], r:[R('Leadership safety walk interval','max',30,'days')] },
        { t:'OH&S Policy', b:`The OH&S policy shall include commitments to provide safe and healthy working conditions, fulfil legal requirements, eliminate hazards and reduce risks, continually improve, and consult and involve workers.`, r:[R('Policy review interval','max',12,'months')] },
        { t:'Roles, Responsibilities & Authorities', b:`Responsibilities and authorities for relevant roles shall be assigned, documented in a RACI matrix and communicated at all levels. Every worker has the authority to stop unsafe work.`, p:['Maintain an OH&S RACI matrix','Include OH&S duties in job descriptions','Document Stop-Work Authority for all workers'] },
        { t:'Consultation & Participation of Workers', b:`Non-managerial workers shall be consulted on determining needs and expectations, establishing the policy, assigning roles, determining legal requirements and planning controls. Workers shall participate in hazard identification, incident investigation and determining corrective actions.`, r:[R('HSE committee meeting interval','max',30,'days'),R('Worker representation on HSE committee','min',50,'%'),R('Employee suggestion response','max',14,'days')] },

      { t:'Planning', b:`When planning for the OH&S management system, ${co} shall determine the risks and opportunities that need to be addressed.`, c:[
        { t:'Hazard Identification & Risk Assessment', b:`A proactive, ongoing process for hazard identification shall consider routine and non-routine activities, human factors, emergency situations, people and changes. Risks shall be assessed using a 5×5 likelihood/severity matrix.`, r:[R('Risk register review interval','max',12,'months'),R('Re-assessment after significant change','max',7,'days')],
          p:['Identify hazards for each task and area','Rate likelihood and severity (5×5 matrix)','Define controls using the hierarchy of controls','Assign an owner and target date to each high risk','Communicate results to affected workers'], c:[
          { t:'Job Safety Analysis (JSA)', b:`A JSA shall be completed before any non-routine or high-risk task and reviewed by the area supervisor.`, r:[R('JSA validity','max',1,'shift')] },

        { t:'Awareness & Communication', b:`Workers shall be made aware of the OH&S policy, relevant hazards and risks, incidents and investigation outcomes, and their right to remove themselves from imminent danger.`, r:[R('Toolbox talks','min',1,'per week'),R('Shift handover record completion','max',1,'hours')] },
        { t:'Documented Information & Records', b:`Documented information shall be controlled for availability, protection, distribution, retention and disposition. OH&S records shall be retained for at least five years following the end of the calendar year they cover.`, r:[R('Injury & illness record retention','min',5,'years'),R('Exposure monitoring record retention','min',30,'years')] },

      { t:'Operational Control', b:`${co} shall plan, implement, control and maintain the processes needed to meet the requirements of the OH&S management system.`, c:[
        { t:'Permit to Work System', b:`High-risk activities shall only be performed under a written, authorised permit to work issued by a competent issuer and accepted by the performing authority.`, p:['Permit is written and authorised before work starts','Isolation and gas test results recorded on the permit','Permit displayed at the worksite','Permit closed out and area handed back'], c:[
          { t:'Hot Work', b:`Welding, cutting, grinding and other spark-producing work shall require a hot work permit. Combustibles within 11 m (35 ft) shall be removed or protected and a trained fire watch shall be maintained during work and for at least 30 minutes after completion.`, r:[R('Gas test before start','max',30,'minutes'),R('Fire watch after completion','min',30,'minutes'),R('Combustible clearance radius','min',11,'m')] },
          { t:'Confined Space Entry', b:`Permit-required confined spaces shall be identified and labelled. Entry requires a written permit, atmospheric testing in the order oxygen, flammables, toxics, a trained attendant outside the space at all times, and a rescue plan.`, r:[R('Atmospheric re-test interval','max',2,'hours'),R('Oxygen level','min',19.5,'%')] },
          { t:'Lockout / Tagout (Energy Isolation)', b:`All hazardous energy sources shall be isolated, locked, tagged and verified before servicing. Energy control procedures shall be inspected periodically at least annually by an authorised employee other than the one using the procedure.`, r:[R('Periodic LOTO procedure inspection','max',12,'months')] },
        ]},
        { t:'Personal Protective Equipment (PPE)', b:`A documented PPE hazard assessment shall be performed for each work area. Required PPE shall be provided at no cost to workers, properly fitted, maintained and used. PPE is the last line of defence and does not replace higher-order controls.`, r:[R('PPE hazard assessment review','max',12,'months'),R('Respirator fit test interval','max',12,'months')] },
        { t:'Hazard Communication & Chemical Safety', b:`A chemical inventory shall be maintained; Safety Data Sheets (SDS) shall be readily accessible to workers in their work area during each shift, and containers labelled according to GHS.`, r:[R('SDS availability','max',0,'minutes to access')] },
        { t:'Working at Heights', b:`Fall protection shall be provided where workers are exposed to a fall of 1.8 m (6 ft) or more in construction, and 1.2 m (4 ft) in general industry. Rescue plans shall be in place before work at height begins.`, r:[R('Fall protection trigger height','max',1.8,'m'),R('Harness & lanyard inspection','max',6,'months')] },

        { t:'Management of Change (MOC)', b:`Planned temporary and permanent changes to processes, equipment, organization or legislation shall be risk-assessed and approved before implementation.`, p:['Raise MOC request','Risk assess the change','Approve by authorised level','Train affected workers','Post-implementation review'], r:[R('Post-implementation review','max',30,'days')] },

        { t:'Fire Protection', b:`Portable fire extinguishers shall be visually inspected monthly and subjected to maintenance at intervals not exceeding one year. Inspection dates shall be recorded on the extinguisher tag.`, r:[R('Extinguisher visual inspection','max',30,'days'),R('Extinguisher annual maintenance','max',12,'months')] },
        { t:'First Aid & Medical Response', b:`Trained first aiders and first aid kits shall be available on every shift. In the absence of a nearby clinic, a person adequately trained to render first aid shall be readily available.`, r:[R('First aid response time','max',4,'minutes'),R('First aiders per shift (per 50 workers)','min',1,'person')] },
      ]},
      { t:'Performance Evaluation', b:`${co} shall monitor, measure, analyse and evaluate its OH&S performance.`, c:[
        { t:'Monitoring, Measurement & KPIs', b:`Leading and lagging indicators shall be tracked, including TRIR, LTIFR, near-miss reporting rate, inspection completion and corrective action closure.`, r:[R('KPI reporting to management','max',30,'days')] },
        { t:'Workplace Inspections', b:`Planned inspections shall be performed by supervisors and HSE personnel using standard checklists; findings are logged as corrective actions.`, r:[R('Supervisor area inspection','max',7,'days'),R('HSE in-house walkthrough','max',14,'days')] },
        { t:'Internal Audit', b:`Internal audits shall be conducted at planned intervals to verify conformity with ISO 45001 and this manual. Auditors shall be objective and impartial.`, r:[R('Full-system audit cycle','max',12,'months')] },
        { t:'Management Review', b:`Top management shall review the OH&S management system at planned intervals to ensure its continuing suitability, adequacy and effectiveness.`, r:[R('Management review interval','max',12,'months')] },
      ]},
      { t:'Incident Management & Improvement', b:`${co} shall establish a process to report, investigate and take action on incidents and nonconformities, and to continually improve.`, c:[
        { t:'Incident Reporting', b:`All incidents, including near misses, shall be reported immediately to the supervisor. Work-related fatalities shall be reported to the authority within 8 hours; in-patient hospitalisation, amputation or loss of an eye within 24 hours. Recordable cases shall be entered in the injury log within 7 calendar days. Workers shall never be disciplined for reporting.`, r:[R('Internal notification','max',1,'hours'),R('Fatality report to authority','max',8,'hours'),R('Hospitalisation / amputation report','max',24,'hours'),R('Entry in injury log','max',7,'days')],
          a:[A(0,'hours','Make the area safe, give first aid, notify supervisor','Supervisor'),A(1,'hours','Log in the incident system and notify HSE','Supervisor'),A(8,'hours','Report fatality to authority (if applicable)','HSE Manager'),A(24,'hours','Report hospitalisation/amputation (if applicable)','HSE Manager')] },
        { t:'Incident Investigation', b:`Incidents shall be investigated by a team including workers to determine root causes using a structured method (e.g. 5-Whys, ICAM, fishbone). Evidence shall be preserved and witnesses interviewed promptly.`, r:[R('Investigation start','max',24,'hours'),R('Preliminary investigation report','max',2,'days'),R('Final report with root cause','max',14,'days')],
          p:['Secure the scene and preserve evidence','Appoint investigation team incl. worker representative','Interview witnesses and collect facts','Determine immediate and root causes','Define corrective and preventive actions (CAPA)','Share lessons learned'],
          a:[A(0,'days','Secure the scene, preserve evidence, appoint lead investigator','Area Manager'),A(1,'days','Collect statements, photos, documents; form team','Lead Investigator'),A(2,'days','Issue preliminary report with immediate causes','Lead Investigator'),A(14,'days','Final report: root causes + CAPA plan approved','HSE Manager'),A(30,'days','Verify CAPA effectiveness and share lessons learned','HSE Manager')] },
        { t:'Corrective & Preventive Action (CAPA)', b:`Corrective actions shall be appropriate to the effects of the incident, assigned to an owner with a due date, and verified for effectiveness before closure.`, r:[R('High-risk CAPA closure','max',30,'days'),R('Other CAPA closure','max',90,'days')] },
        { t:'Continual Improvement', b:`${co} shall continually improve the suitability, adequacy and effectiveness of the OH&S management system by enhancing performance, promoting a supportive culture and promoting worker participation.` },
      ]},
    ];
    const ops = T[5].c;
    if (/construct|scaffold|excavat|civil|building/i.test(kw)) ops.push({ t:'Scaffolding & Excavation', b:`Scaffolds shall be erected, inspected and tagged by competent persons. Excavations deeper than 1.5 m (5 ft) require a protective system unless in stable rock.`, r:[R('Scaffold inspection','max',7,'days'),R('Excavation protective system trigger','max',1.5,'m')] });
    if (/chemical|oil|gas|petro|refin|plant|process/i.test(kw)) ops.push({ t:'Process Safety Management', b:`Highly hazardous processes shall have process safety information, process hazard analysis (PHA), operating procedures and mechanical integrity programmes.`, r:[R('PHA revalidation','max',5,'years')] });
    if (/vehicle|driv|fleet|transport|logistic|truck/i.test(kw)) ops.push({ t:'Road & Vehicle Safety', b:`Drivers shall hold valid licences, complete defensive driving training and pre-trip inspections. Seat belts are mandatory; mobile phone use while driving is prohibited.`, r:[R('Continuous driving before rest','max',4,'hours'),R('Defensive driving refresher','max',24,'months')] });
    if (/weld|fabricat|metal|workshop/i.test(kw)) ops[0].c[0].p = ['Hot work permit issued before work','Fire extinguisher at the point of work','Welding screens to protect others','Fume extraction in enclosed areas','Fire watch for at least 30 minutes after work'];
    return T;
  }

  /* ---------- Generic Annex SL (HLS) template for other standards ---------- */
  function hls(co, refs, domain, type) {
    const d = domain.toLowerCase();
    const ops = {
      environment:[
        { t:'Environmental Aspects & Impacts', b:`${co} shall determine the environmental aspects of its activities, products and services that it can control and influence, and their associated impacts, considering a life-cycle perspective.`, r:[R('Aspects register review','max',12,'months')] },
        { t:'Waste Management', b:`Waste shall be segregated at source, stored in labelled containers and disposed of only through licensed contractors with documented chain of custody.`, r:[R('Hazardous waste on-site storage','max',90,'days')] },
        { t:'Spill Prevention & Response', b:`Spill kits shall be available near chemical storage; spills shall be contained, reported and cleaned up immediately.`, r:[R('Spill reporting','max',1,'hours')] },
      ],
      quality:[
        { t:'Customer Requirements', b:`Requirements for products and services shall be determined, reviewed before commitment and communicated to relevant functions.` },
        { t:'Control of Nonconforming Outputs', b:`Nonconforming outputs shall be identified and controlled to prevent unintended use or delivery.`, r:[R('Nonconformity containment','max',24,'hours'),R('Root cause analysis','max',10,'days')] },
        { t:'Supplier Control', b:`External providers shall be evaluated, selected and monitored based on their ability to provide conforming products and services.`, r:[R('Supplier re-evaluation','max',12,'months')] },
      ],
      emergency:[
        { t:'Emergency Scenarios & Business Impact', b:`Credible emergency scenarios shall be identified and their impacts on people, environment, assets and continuity assessed.` },
        { t:'Emergency Organization & Roles', b:`An emergency organization with incident commander, wardens, first aiders and communication lead shall be appointed for every site and shift.`, r:[R('Fire wardens per floor','min',2,'person')] },
        { t:'Drills, Exercises & Testing', b:`Exercises shall test plans and capabilities, ranging from tabletop to full-scale exercises.`, r:[R('Evacuation drill interval','max',6,'months'),R('Full-scale exercise interval','max',24,'months')],
          a:[A(0,'minutes','Raise alarm and start evacuation','Any worker'),A(5,'minutes','Headcount at assembly point','Fire Warden'),A(15,'minutes','Incident commander briefs emergency services','Incident Commander'),A(7,'days','Debrief and corrective actions issued','HSE Manager')] },
      ],
      risk:[
        { t:'Risk Appetite & Criteria', b:`The board shall define risk appetite and tolerance criteria for each risk category.`, r:[R('Risk appetite review','max',12,'months')] },
        { t:'Risk Treatment', b:`Risk treatment options shall be selected and implemented; residual risk shall be accepted by the appropriate authority level.`, r:[R('Treatment plan for high risks','max',30,'days')] },
      ],
    }[type] || [{ t:`${domain} Operational Controls`, b:`${co} shall plan and control the processes needed to meet the requirements of this ${d} standard.` }];
    return [
      { t:'Purpose, Scope & References', b:`This standard defines the ${d} requirements applicable to ${co}.`, c:[
        { t:'Purpose', b:`To establish a consistent, auditable ${d} system aligned with ${refs.join(', ') || 'recognised good practice'}.` },
        { t:'Scope', b:`Applies to all ${co} sites, functions, employees and contractors.` },
        { t:'Normative References', b: refs.length ? refs.map(r=>'• '+r).join('\n') : '• Internal good practice' } ]},
      { t:'Context of the Organization', b:`Internal and external issues and interested-party requirements relevant to ${d} shall be determined and reviewed.`, r:[R('Context review interval','max',12,'months')] },
      { t:'Leadership', b:`Top management shall demonstrate leadership and commitment, establish the ${d} policy and assign roles, responsibilities and authorities.`, c:[
        { t:'Policy', b:`The ${d} policy shall be documented, communicated and available to interested parties.`, r:[R('Policy review interval','max',12,'months')] },
        { t:'Roles & Responsibilities', b:`Responsibilities shall be assigned and communicated through a RACI matrix.` } ]},
      { t:'Planning', b:`Risks and opportunities, compliance obligations and objectives shall be determined and planned.`, c:[
        { t:'Risks & Opportunities', b:`Risks and opportunities shall be assessed and actions integrated into processes.` },
        { t:'Objectives', b:`Measurable objectives shall be set, monitored and updated.`, r:[R('Objectives review','max',3,'months')] } ]},
      { t:'Support', b:`Resources, competence, awareness, communication and documented information shall be provided.`, c:[
        { t:'Competence & Awareness', b:`Personnel shall be competent and aware of their contribution.`, r:[R('Refresher training','max',12,'months')] },
        { t:'Documented Information', b:`Documented information shall be controlled and retained.`, r:[R('Record retention','min',5,'years')] } ]},
      { t:'Operation', b:`Operational planning and control shall be implemented for all ${d} processes.`, c: ops },
      { t:'Performance Evaluation', b:`Performance shall be monitored, internally audited and reviewed by management.`, c:[
        { t:'Internal Audit', b:`Internal audits shall be performed at planned intervals.`, r:[R('Audit cycle','max',12,'months')] },
        { t:'Management Review', b:`Top management shall review the system at planned intervals.`, r:[R('Management review','max',12,'months')] } ]},
      { t:'Improvement', b:`Nonconformities shall be corrected, root causes eliminated and the system continually improved.`, r:[R('Corrective action closure','max',60,'days')] },
    ];
  }

  function breachFor(label) {
    const L = (label || '').toLowerCase(), St = (offset, unit, ...acts) => ({ offset, unit, actions:acts.map(([text, owner]) => ({ text, owner })) });
    if (/fire watch|gas test|combustible|oxygen|fall|trigger|clearance|re-test/.test(L)) return [St(0, 'minutes', ['Stop the work immediately and make the area safe', 'Permit Issuer'], ['Report the breach as a near miss', 'Supervisor']), St(1, 'days', ['Investigate the permit breach and re-brief the crew', 'HSE Officer'])];
    if (/investigation|report|notification|log|reporting/.test(L)) return [St(0, 'hours', ['Notify the HSE Manager and the area manager', 'System'], ['Record a non-conformance against the responsible department', 'HSE Officer']), St(24, 'hours', ['Escalate to the department head with a recovery date', 'HSE Manager']), St(3, 'days', ['Escalate to the CEO and include in the weekly HSE report', 'HSE Director'])];
    if (/capa|closure/.test(L)) return [St(0, 'days', ['Notify the CAPA owner and their manager', 'System']), St(14, 'days', ['Escalate to the management review', 'HSE Director'])];
    if (/inspection|walk|audit|review|maintenance|fit test|refresher|interval|revalidation|evaluation/.test(L)) return [St(0, 'days', ['Tag the item or area as overdue and notify its owner', 'System']), St(7, 'days', ['Escalate to the department head — item may not be used until inspected', 'HSE Manager'])];
    if (/toolbox|training|induction|first aid|representation|committee|hours per worker|wardens/.test(L)) return [St(0, 'days', ['Notify the department head', 'System']), St(7, 'days', ['Add a corrective action to the department improvement plan', 'HSE Manager'])];
    return [St(0, 'days', ['Notify the responsible manager', 'System']), St(7, 'days', ['Escalate to the department head', 'HSE Manager'])];
  }
  const withBreach = nodes => (nodes || []).forEach(n => { (n.r || []).forEach(q => { if (!q.breach) q.breach = breachFor(q.label); }); withBreach(n.c); });

  function generate({ type, company, refs, description, title }) {
    const co = (company || 'the Company').trim();
    const kw = (description || '') + ' ' + (title || '');
    const isSafety = type === 'safety' || refs.some(r => /45001|OSHA|ILO/.test(r)) && type !== 'environment' && type !== 'quality' && type !== 'risk' && type !== 'emergency';
    const tname = (TYPES.find(t => t.id === type) || {}).name || title || 'Standard';
    const t = isSafety ? safety(co, refs.length ? refs : ['ISO 45001:2018'], kw) : hls(co, refs, tname.replace(/ (Manual|Standard)$/,''), type);
    withBreach(t); return t;
  }

  /* ---------- Offline drafting for a single clause ---------- */
  function draftClause(title, ctx) {
    const t = title.toLowerCase();
    const lib = [
      [/investigat/, 'Every incident and near miss shall be investigated proportionately to its actual and potential severity. The investigation team shall include a worker representative, preserve evidence, identify immediate and root causes, and define corrective and preventive actions with owners and due dates.'],
      [/report/, 'All incidents, near misses and unsafe conditions shall be reported immediately to the direct supervisor and logged in the incident management system before the end of the shift. Reporting shall never lead to reprisal.'],
      [/train|competen/, 'Each role shall have defined competence requirements. Training shall be delivered before the task is performed, evaluated for effectiveness, recorded and refreshed at defined intervals.'],
      [/ppe|protective/, 'PPE shall be selected based on a documented hazard assessment, provided at no cost, fitted to the individual, inspected before use and replaced when damaged. PPE complements, and never replaces, higher-order controls.'],
      [/audit/, 'Audits shall be planned on the basis of risk and previous results, performed by competent and impartial auditors, and reported to relevant management. Findings shall be tracked to closure.'],
      [/emergenc|drill|fire/, 'Emergency arrangements shall be documented, communicated, resourced and tested through periodic drills. Lessons learned shall be captured and actions tracked to closure.'],
      [/contract/, 'Contractors shall be pre-qualified, inducted, supervised and evaluated. Their OH&S performance shall be monitored with the same rigour as for employees.'],
      [/risk|hazard/, 'Hazards shall be identified proactively for routine and non-routine work; risks shall be assessed, controlled through the hierarchy of controls, and reviewed after incidents and changes.'],
    ];
    const hit = lib.find(([re]) => re.test(t));
    return hit ? hit[1] : `This clause defines the requirements for ${title.toLowerCase()} at ${ctx.company || 'the Company'}. Responsibilities, minimum frequencies and records shall be defined, and conformity shall be verified through inspection and audit against ${(ctx.refs||[]).join(', ') || 'the referenced standards'}.`;
  }

  /* ---------- Compliance rules (offline conflict engine) ---------- */
  const H = { minute:1/60, minutes:1/60, min:1/60, hour:1, hours:1, hr:1, hrs:1, h:1, day:24, days:24, week:168, weeks:168, month:730, months:730, year:8760, years:8760, shift:12 };
  const toHours = (n, u) => n * (H[(u||'').toLowerCase()] ?? H[(u||'').toLowerCase().replace(/s$/,'')] ?? 1);
  const WORDNUM = { one:1, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8, ten:10, twelve:12, fourteen:14, thirty:30 };
  const durRe = /(\d+(?:\.\d+)?|one|two|three|four|five|six|seven|eight|ten|twelve|fourteen|thirty)\s*(?:\(\d+\)\s*)?(?:calendar\s+|working\s+|business\s+)?(minutes?|hours?|hrs?|days?|weeks?|months?|years?)/gi;
  function durations(s) { const out = []; let m; durRe.lastIndex = 0; while ((m = durRe.exec(s))) { const n = isNaN(+m[1]) ? WORDNUM[m[1].toLowerCase()] : +m[1]; out.push({ n, u:m[2], h:toHours(n, m[2]) }); } return out; }
  const freqH = s => /\bannual(ly)?\b|\byearly\b|once a year|every year/i.test(s) ? 8760 : /\bquarterly\b/i.test(s) ? 2190 : /every (two|2) years|biennial/i.test(s) ? 17520 : /semi-?annual|every (six|6) months/i.test(s) ? 4380 : null;
  const sentences = text => (text || '').split(/(?<=[.!?;])\s+|\n+/).map(s => s.trim()).filter(s => s.length > 8);

  const RULES = [
    { id:'osha-fatal', ref:'OSHA 29 CFR 1904.39(a)(1)', refs:/OSHA|1904/, sev:'high',
      test:s => /fatalit|death|died/i.test(s) && /report|notif/i.test(s) && durations(s).some(d => d.h > 8),
      msg:'OSHA requires every work-related fatality to be reported within 8 hours. The text allows a longer period.', fix:'Report work-related fatalities to the authority within 8 hours.' },
    { id:'osha-hosp', ref:'OSHA 29 CFR 1904.39(a)(2)', refs:/OSHA|1904/, sev:'high',
      test:s => /hospital|amputat|loss of an eye/i.test(s) && /report|notif/i.test(s) && durations(s).some(d => d.h > 24) && !/fatalit/i.test(s),
      msg:'In-patient hospitalisation, amputation or loss of an eye must be reported within 24 hours.', fix:'Report in-patient hospitalisation, amputation or loss of an eye within 24 hours.' },
    { id:'osha-log', ref:'OSHA 29 CFR 1904.29(b)(3)', refs:/OSHA|1904/, sev:'medium',
      test:s => /(injury|osha|300)\s*log|record(able)? case/i.test(s) && /enter|record|log/i.test(s) && durations(s).some(d => d.h > 7*24),
      msg:'Recordable cases must be entered on the injury log within 7 calendar days.', fix:'Enter recordable cases in the injury log within 7 calendar days.' },
    { id:'osha-retain', ref:'OSHA 29 CFR 1904.33', refs:/OSHA|1904|45001/, sev:'medium',
