}
function log(m, text, kind = 'edit') {
  const e = { ts:now(), userId:S.me, manualId:m ? m.id : null, text, kind };
  if (m) { m.log = m.log || []; m.log.unshift(e); if (m.log.length > 200) m.log.length = 200; }
  S.activity.unshift(e); if (S.activity.length > 400) S.activity.length = 400;
}
const L = (m, c) => `#/m/${m.id}${c ? '/c/' + c.id : ''}`;

/* ---------- Factories ---------- */
function newClause(o = {}) { return { id:uid('c'), parentId:null, order:0, title:'Untitled clause', body:'', assigneeId:null, assignedById:null, deadline:null, status:'not_started', requirements:[], steps:[], actions:[], comments:[], history:[], ...o }; }
function newManual(o = {}) { return { id:uid('m'), title:'Untitled Manual', type:'custom', code:'DOC-000', version:'0.1', company:S.settings.company, description:'', references:[], ownerId:S.me, stage:'setup', createdAt:now(), clauses:[], deptReview:null, approval:null, publishedAt:null, variations:[], conflicts:[], conflictsAt:null, conflictsSource:null, log:[], revisions:[], governanceDeptId:null, ...o }; }
function treeToClauses(tree, parentId = null, out = []) {
  (tree || []).forEach((n, i) => {
    const c = newClause({ parentId, order:i, title:n.t || n.title || 'Clause', body:n.b || n.body || '',
      requirements:(n.r || n.requirements || []).map(r => ({ id:uid('q'), label:r.label, type:r.type === 'min' ? 'min' : 'max', value:+r.value || 0, unit:r.unit || 'days', breach:(r.breach || KB.breachFor(r.label)).map(s => ({ id:uid('b'), offset:+s.offset || 0, unit:s.unit || 'hours', actions:(s.actions || []).map(a => ({ id:uid('x'), text:a.text || a.action || '', owner:a.owner || '' })) })) })),
      steps:(n.p || n.points || []).slice(),
      actions:(n.a || n.actions || []).map(a => ({ id:uid('a'), offset:+a.offset || 0, unit:a.unit || 'days', action:a.action || '', owner:a.owner || '' })) });
    out.push(c); treeToClauses(n.c || n.children, c.id, out);
  });
  return out;
}

/* ---------- Clause workflow ---------- */
function assignClause(m, c, userId, deadline) {
  const prev = c.assigneeId;
  c.assigneeId = userId || null; c.assignedById = userId ? S.me : null; c.deadline = deadline || null; c.reminded = false;
  if (c.status === 'approved' && userId && userId !== prev) c.status = 'in_progress';
  const n = nums(m)[c.id];
  c.history.push({ ts:now(), userId:S.me, text:userId ? `Assigned to ${uname(userId)}${deadline ? ' · due ' + fmtD(deadline) : ''}` : 'Unassigned' });
  if (userId && userId !== S.me && m.stage !== 'setup') notify(userId, `${uname(S.me)} assigned you clause ${n} “${c.title}” in ${m.title}${deadline ? ' — due ' + fmtD(deadline) : ''}`, '#/writing', 'assign');
  log(m, `assigned ${n} ${c.title} to ${uname(userId)}`, 'assign');
}
function ownedBundle(m, c) { // c + descendants that travel with it (unassigned or same assignee)
  const out = [c]; const w = pid => kids(m, pid).forEach(k => { if (!k.assigneeId || k.assigneeId === c.assigneeId) { out.push(k); w(k.id); } }); w(c.id); return out;
}
function submitBlockers(m, c) { return descendants(m, c.id).filter(d => d.assigneeId && d.assigneeId !== c.assigneeId && d.status !== 'approved'); }
function reviewerOf(m, c) {
  if (c.assignedById && c.assignedById !== c.assigneeId) return c.assignedById;
  const a = ancestors(m, c).reverse().find(x => x.assigneeId && x.assigneeId !== c.assigneeId);
  return a ? a.assigneeId : (c.assigneeId === m.ownerId ? null : m.ownerId);
}
function submitClause(m, c) {
  const rv = reviewerOf(m, c); const n = nums(m)[c.id];
  if (!rv || rv === S.me) { return approveClause(m, c, true); }
  ownedBundle(m, c).forEach(k => { if (k.status !== 'approved') k.status = 'submitted'; });
  c.submittedAt = now(); c.reviewerId = rv;
  c.history.push({ ts:now(), userId:S.me, text:`Submitted for review to ${uname(rv)}` });
  notify(rv, `${uname(S.me)} submitted ${n} “${c.title}” for your review`, L(m, c), 'review');
  log(m, `submitted ${n} ${c.title} for review`, 'submit');
}
function approveClause(m, c, self) {
  const n = nums(m)[c.id];
  ownedBundle(m, c).forEach(k => k.status = 'approved');
  c.approvedAt = now(); c.approvedBy = S.me;
  c.history.push({ ts:now(), userId:S.me, text:self ? 'Approved (self / owner)' : 'Review approved' });
  if (c.assigneeId && c.assigneeId !== S.me) notify(c.assigneeId, `${uname(S.me)} approved your clause ${n} “${c.title}”`, L(m, c), 'approved');
  // ripple: tell the person responsible for the parent that a sub-clause is done
  const p = clause(m, c.parentId);
  if (p) { const r = responsibleFor(m, p); if (r !== S.me && kids(m, p.id).every(k => k.status === 'approved')) notify(r, `All sub-clauses under ${nums(m)[p.id]} “${p.title}” are approved — ready for you to submit`, L(m, p), 'ready'); }
  if (kids(m, null).every(k => k.status === 'approved')) notify(m.ownerId, `All clauses of ${m.title} are approved — ready for department review`, L(m), 'ready');
  log(m, `approved ${n} ${c.title}`, 'approve');
}
function returnClause(m, c, note) {
  const n = nums(m)[c.id];
  ownedBundle(m, c).forEach(k => { if (k.status === 'submitted') k.status = 'changes_requested'; });
  c.history.push({ ts:now(), userId:S.me, text:'Changes requested' + (note ? ': ' + note : '') });
  const open = c.comments.filter(x => !x.resolved).length;
  notify(c.assigneeId || responsibleFor(m, c), `${uname(S.me)} requested changes on ${n} “${c.title}” (${open} open comment${open === 1 ? '' : 's'})`, L(m, c), 'changes');
  log(m, `requested changes on ${n} ${c.title}`, 'return');
}
function reopenClause(m, c) { ownedBundle(m, c).forEach(k => k.status = 'in_progress'); c.history.push({ ts:now(), userId:S.me, text:'Re-opened for editing' }); log(m, `re-opened ${nums(m)[c.id]} ${c.title}`); }
function touchClause(c) { if (c.status === 'not_started' || c.status === 'changes_requested') { if (c.status === 'not_started') c.status = 'in_progress'; } c.updatedAt = now(); c.updatedBy = S.me; }

/* ---------- Department review ---------- */
function startDeptReview(m, deptIds, days) {
  m.stage = 'dept_review';
  m.deptReview = { round:1, startedAt:now(), items:deptIds.map(d => ({ deptId:d, reviewerId:deptHead(d), status:'pending', deadline:now() + days * DAY, note:'', actedAt:null })) };
  m.deptReview.items.forEach(i => notify(i.reviewerId, `${m.title} has been sent to ${dept(i.deptId).name} for review — due ${fmtD(i.deadline)}`, L(m) + '/t/dept', 'dept'));
  log(m, `sent manual to ${deptIds.length} departments for review`, 'dept');
}
function deptAct(m, deptId, act, note) {
  const it = m.deptReview.items.find(i => i.deptId === deptId);
  it.status = act === 'accept' ? 'accepted' : 'returned'; it.note = note || ''; it.actedAt = now(); it.actedBy = S.me;
  notify(m.ownerId, `${dept(deptId).name} ${act === 'accept' ? 'accepted' : 'returned with comments'}: ${m.title}${note ? ' — “' + note + '”' : ''}`, L(m) + '/t/dept', act === 'accept' ? 'approved' : 'changes');
  log(m, `${dept(deptId).name} ${act === 'accept' ? 'accepted the manual' : 'returned the manual with comments'}`, 'dept');
}
function recirculate(m, days) {
  m.deptReview.round++;
  m.deptReview.items.filter(i => i.status === 'returned').forEach(i => { i.status = 'pending'; i.deadline = now() + days * DAY; i.note = ''; notify(i.reviewerId, `Revised ${m.title} (round ${m.deptReview.round}) is back for ${dept(i.deptId).name} review`, L(m) + '/t/dept', 'dept'); });
  log(m, `re-circulated to departments (round ${m.deptReview.round})`, 'dept');
}

/* ---------- Approval chain ---------- */
function startApproval(m, steps) {
  m.stage = 'approval';
  m.approval = { round:1, status:'in_progress', startedAt:now(), steps:steps.map((s, i) => ({ id:uid('s'), userId:s.userId, role:s.role, days:s.days, deadline:i === 0 ? now() + s.days * DAY : null, status:i === 0 ? 'pending' : 'waiting', history:[] })) };
  const f = m.approval.steps[0]; notify(f.userId, `Approval required: ${m.title} (${f.role}) — due ${fmtD(f.deadline)}`, L(m) + '/t/approval', 'approval');
  log(m, `started approval chain with ${steps.length} approvers`, 'approval');
}
function advanceChain(m) {
  const nx = m.approval.steps.find(s => s.status === 'waiting');
  if (nx) { nx.status = 'pending'; nx.deadline = now() + nx.days * DAY; notify(nx.userId, `Approval required: ${m.title} (${nx.role}) — due ${fmtD(nx.deadline)}`, L(m) + '/t/approval', 'approval'); }
  else { m.approval.status = 'complete'; m.approval.completedAt = now(); notify(m.ownerId, `${m.title} is fully approved — ready to publish`, L(m) + '/t/approval', 'ready'); log(m, 'approval chain completed', 'approval'); }
}
function approvalAct(m, stepId, act, note) {
  const s = m.approval.steps.find(x => x.id === stepId);
  s.actedAt = now(); s.comment = note || ''; s.history.push({ ts:now(), userId:S.me, text:act + (note ? ': ' + note : '') });
  if (act === 'approve') { s.status = 'approved'; s.signedBy = S.me; log(m, `approved as ${s.role}`, 'approval'); notify(m.ownerId, `${uname(S.me)} approved ${m.title} (${s.role})`, L(m) + '/t/approval', 'approved'); advanceChain(m); }
  else { s.status = 'returned'; m.approval.status = 'returned'; log(m, `returned the manual as ${s.role}: ${note}`, 'return'); notify(m.ownerId, `${uname(S.me)} returned ${m.title}: “${note}”`, L(m) + '/t/approval', 'changes'); }
}
function delegateStep(m, stepId, to, note) {
  const s = m.approval.steps.find(x => x.id === stepId); const from = s.userId;
  s.delegatedFrom = from; s.userId = to; s.history.push({ ts:now(), userId:S.me, text:`Delegated from ${uname(from)} to ${uname(to)}${note ? ': ' + note : ''}` });
  notify(to, `${uname(S.me)} delegated approval of ${m.title} (${s.role}) to you`, L(m) + '/t/approval', 'approval');
  log(m, `delegated ${s.role} approval from ${uname(from)} to ${uname(to)}`, 'approval');
}
function escalateStep(m, stepId, to, reassign, note, auto) {
  const s = m.approval.steps.find(x => x.id === stepId);
  s.escalated = (s.escalated || 0) + 1; s.escalatedTo = to;
  s.history.push({ ts:now(), userId:auto ? null : S.me, text:`${auto ? 'Auto-escalated' : 'Escalated'} to ${uname(to)}${reassign ? ' (reassigned)' : ''}${note ? ': ' + note : ''}` });
  notify(to, `Escalation: approval of ${m.title} (${s.role}) by ${uname(s.userId)} is ${dueInfo(s.deadline).od ? 'overdue' : 'pending'}${note ? ' — ' + note : ''}`, L(m) + '/t/approval', 'escalation');
  notify(s.userId, `Your pending approval of ${m.title} was escalated to ${uname(to)}`, L(m) + '/t/approval', 'escalation');
  if (reassign) { s.delegatedFrom = s.userId; s.userId = to; s.deadline = now() + 2 * DAY; }
  log(m, `${auto ? 'auto-' : ''}escalated ${s.role} approval to ${uname(to)}`, 'escalation');
}
function skipStep(m, stepId, reason) {
  const s = m.approval.steps.find(x => x.id === stepId);
  s.status = 'skipped'; s.comment = reason; s.actedAt = now(); s.history.push({ ts:now(), userId:S.me, text:'Skipped: ' + reason });
  notify(s.userId, `Your approval step for ${m.title} was skipped by ${uname(S.me)}`, L(m) + '/t/approval');
  log(m, `skipped ${s.role} approval (${reason})`, 'approval'); advanceChain(m);
}
function resubmitApproval(m) {
  m.approval.round++; m.approval.status = 'in_progress';
  m.approval.steps.forEach((s, i) => { if (s.status !== 'skipped') { s.status = i === 0 ? 'pending' : 'waiting'; s.deadline = i === 0 ? now() + s.days * DAY : null; s.signedBy = null; } });
  const f = m.approval.steps.find(s => s.status === 'pending');
  if (f) notify(f.userId, `Revised ${m.title} resubmitted for approval (round ${m.approval.round})`, L(m) + '/t/approval', 'approval');
  log(m, `resubmitted for approval (round ${m.approval.round})`, 'approval');
}
function publish(m, note) {
  const v = parseFloat(m.version) || 0; m.version = v < 1 ? '1.0' : (Math.floor(v) + 1) + '.0';
  m.stage = 'published'; m.publishedAt = now();
  m.revisions.unshift({ version:m.version, ts:now(), by:S.me, note:note || 'Initial issue' });
  notify(S.departments.map(d => d.headId).filter(h => h !== S.me), `${m.title} v${m.version} has been published. Review applicability for your department.`, L(m) + '/t/book', 'published');
  log(m, `published version ${m.version}`, 'publish');
}
function startRevision(m) {
  m.stage = 'drafting'; m.version = (parseFloat(m.version) + 0.1).toFixed(1); m.deptReview = null; m.approval = null;
  log(m, `started revision ${m.version}`, 'edit');
}

/* ---------- Variations (dept adoption: N/A, tighten, add) ---------- */
function reqById(m, rid) { for (const c of m.clauses) { const q = c.requirements.find(r => r.id === rid); if (q) return { c, q }; } return null; }
function validateTighten(q, v) {
  v = +v; if (isNaN(v)) return 'Enter a number.';
  if (q.type === 'max' && v >= q.value) return `This is a MAXIMUM of ${q.value} ${q.unit}. Your value must be lower (stricter) than the standard — e.g. ${Math.max(0, q.value - 1)}.`;
  if (q.type === 'min' && v <= q.value) return `This is a MINIMUM of ${q.value} ${q.unit}. Your value must be higher (stricter) than the standard — e.g. ${q.value + 1}.`;
  return null;
}
function requestVariation(m, v) {
  v = { id:uid('v'), status:'pending', ts:now(), requestedBy:S.me, thread:[], ...v }; m.variations.unshift(v);
  const gov = m.governanceDeptId || S.settings.governanceDeptId;
  const n = nums(m)[v.clauseId];
  notify(deptUsers(gov).map(u => u.id).filter(u => u !== S.me), `${dept(v.deptId).name} requests ${VK[v.kind].l.toLowerCase()} on ${n} — ${m.title}`, L(m) + '/t/variations', 'variation');
  log(m, `${dept(v.deptId).name} raised a ${VK[v.kind].l.toLowerCase()} request on ${n}`, 'variation');
  return v;
}
function decideVariation(m, vid, act, comment) {
  const v = m.variations.find(x => x.id === vid);
  v.status = act === 'approve' ? 'approved' : 'returned'; v.decidedBy = S.me; v.decidedAt = now(); v.comment = comment || '';
  v.thread.push({ ts:now(), userId:S.me, text:(act === 'approve' ? 'Approved' : 'Returned') + (comment ? ': ' + comment : '') });
  notify(v.requestedBy, `Your ${VK[v.kind].l.toLowerCase()} request on ${nums(m)[v.clauseId]} was ${v.status}${comment ? ' — “' + comment + '”' : ''}`, L(m) + '/t/variations', act === 'approve' ? 'approved' : 'changes');
  log(m, `${v.status} ${dept(v.deptId).name}'s ${VK[v.kind].l.toLowerCase()} request`, 'variation');
}
const VK = { na:{ l:'Not applicable', b:'b-gray', i:'ban' }, tighten:{ l:'Stricter limit', b:'b-orange', i:'target' }, add:{ l:'Improvement', b:'b-violet', i:'plus' } };
function effective(m, deptId) {
  const r = { na:{}, tight:{}, adds:{}, edits:{} };
  if (!deptId) return r;
  m.variations.filter(v => v.deptId === deptId && v.status === 'approved').sort((a, b) => (a.decidedAt || 0) - (b.decidedAt || 0)).forEach(v => {
    if (v.kind === 'na') r.na[v.clauseId] = v;
    if (v.kind === 'tighten') r.tight[v.reqId] = v;
    if (v.kind === 'add') (r.adds[v.clauseId] = r.adds[v.clauseId] || []).push(v);
    if (v.kind === 'edit') {
      r.edits[v.clauseId] = v;
      if (v.after.na) r.na[v.clauseId] = v; else delete r.na[v.clauseId];
      (v.after.reqs || []).forEach(q => { const b = reqById(m, q.id); if (!b) return; if (+q.value !== +b.q.value) r.tight[q.id] = { ...v, reqId:q.id, proposed:+q.value }; else delete r.tight[q.id]; });
    }
  });
  return r;
}

/* ---------- Deadline sweep (reminders + auto-escalation) ---------- */
function sweep() {
  let changed = false;
  S.manuals.forEach(m => {
    if (m.stage === 'drafting') m.clauses.forEach(c => {
      if (c.assigneeId && c.deadline && c.status !== 'approved' && c.status !== 'submitted' && !c.reminded && c.deadline - now() < 2 * DAY) {
        c.reminded = true; changed = true;
        notify(c.assigneeId, `Reminder: ${nums(m)[c.id]} “${c.title}” is ${dueInfo(c.deadline).t.toLowerCase()}`, L(m, c), 'reminder');
      }
    });
    if (m.stage === 'approval' && m.approval?.status === 'in_progress' && S.settings.autoEscalate) {
      const s = m.approval.steps.find(x => x.status === 'pending');
      if (s && s.deadline && s.deadline < now() && !s.autoEscalated) {
        s.autoEscalated = true; changed = true;
        const prev = S.me; escalateStep(m, s.id, S.settings.escalationUserId, false, 'deadline passed', true); S.me = prev;
      }
    }
  });
  if (changed) save();
  return changed;
}

/* ---------- AI (Claude API with offline engine fallback) ---------- */
const AI = {
  hasKey: () => !!(S.settings.apiKey || '').trim(),
  async call(system, prompt, maxTokens = 16000) {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{ 'content-type':'application/json', 'x-api-key':S.settings.apiKey.trim(), 'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true', 'anthropic-beta':'server-side-fallback-2026-07-01' },
      body:JSON.stringify({ model:S.settings.model || 'claude-opus-5-5', max_tokens:maxTokens, output_config:{ effort:'medium' }, fallbacks:'default',
        system, messages:[{ role:'user', content:prompt }] }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error((data.error && data.error.message) || `HTTP ${res.status}`);
    if (data.stop_reason === 'refusal') throw new Error('The model declined this request.');
    return (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
  },
  json(t) { t = t.replace(/```(?:json)?/g, ''); const a = t.indexOf('{'), b = t.lastIndexOf('}'); return JSON.parse(t.slice(a, b + 1)); },
  SYS:'You are a principal management-systems and HSE standards author (ISO 45001, ISO 14001, ISO 9001, OSHA, NFPA). You write precise, auditable corporate manuals using "shall" language. You respond with JSON only, no prose.',
  async generate(o) {
    if (!this.hasKey()) return { tree:KB.generate(o), source:'offline' };
    const prompt = `Create the full clause structure for a corporate document.
Document type: ${o.typeName}
Title: ${o.title}
Company: ${o.company}
Company description / context: ${o.description || '(none)'}
Reference standards to comply with: ${o.refs.join(', ') || '(choose suitable ones)'}
Detail level: ${o.depth}

Return JSON: {"clauses":[{"title":string,"body":string,"requirements":[{"label":string,"type":"max"|"min","value":number,"unit":string}],"points":[string],"actions":[{"offset":number,"unit":"minutes"|"hours"|"days","action":string,"owner":string}],"children":[ ...same shape... ]}]}
Rules:
- ${o.depth === 'concise' ? '6-8 top-level sections, 2-3 sub-clauses each' : o.depth === 'detailed' ? '9-11 top-level sections, 3-5 sub-clauses each, third level where useful' : '8-10 top-level sections, 2-4 sub-clauses each, occasional third level'}.
- Follow the structure of the references (e.g. ISO Annex SL clauses 4-10) and tailor content to the company description.
- body: 2-4 sentences of mandatory "shall" requirements, specific to the company.
- requirements: numeric MIN/MAX limits departments must follow (e.g. max 2 days to issue a preliminary investigation report). Values must be equal to or stricter than the references.
- points: mandatory steps where a procedure is implied.
- actions: time-phased response actions (offset from the trigger event) only where a time-sequenced response applies (incidents, emergencies, nonconformities).
- Empty arrays are fine. JSON only.`;
    const t = await this.call(this.SYS, prompt, 32000);
    const j = this.json(t);
    return { tree:j.clauses || [], source:'claude' };
  },
  async check(m) {
    const n = nums(m);
    const local = KB.check(m, m.clauses, n);
    if (!this.hasKey()) return { conflicts:local, source:'offline' };
    const items = flat(m).map(({ c }) => ({ id:c.id, num:n[c.id], title:c.title, body:c.body, requirements:c.requirements.map(r => `${r.label}: ${r.type} ${r.value} ${r.unit}`) }));
    const prompt = `Reference standards: ${m.references.join(', ')}
Company: ${m.company}
Below are the clauses of the draft "${m.title}". Identify every statement or requirement value that CONTRADICTS or is LESS STRICT than the reference standards (e.g. longer reporting deadline than OSHA, optional PPE, no worker consultation, inspection intervals too long). Do not report missing topics or style issues.
Return JSON: {"conflicts":[{"clauseId":string,"quote":string,"reference":string,"severity":"high"|"medium"|"low","explanation":string,"suggestion":string}]}
- quote MUST be an exact, verbatim substring of that clause's body (or the exact requirement string as listed).
- reference: the specific clause of the standard, e.g. "OSHA 29 CFR 1904.39(a)(1)" or "ISO 45001:2018 §5.4".
- suggestion: compliant replacement wording.
Clauses:
${JSON.stringify(items)}`;
    const j = this.json(await this.call(this.SYS, prompt, 16000));
    return { conflicts:(j.conflicts || []).filter(x => clause(m, x.clauseId)), source:'claude' };
  },
  async draft(m, c) {
    const ctx = { company:m.company, refs:m.references };
    if (!this.hasKey()) return { text:KB.draftClause(c.title, ctx), source:'offline' };
    const path = [...ancestors(m, c), c].map(x => nums(m)[x.id] + ' ' + x.title).join(' › ');
    const t = await this.call(this.SYS, `Write the body text for clause "${path}" of "${m.title}" for ${m.company}. Context: ${m.description || ''}. Must comply with: ${m.references.join(', ')}. ${c.body ? 'Current draft to improve: ' + c.body : ''}
Return JSON {"body": string} — 3-6 sentences of auditable "shall" requirements, plain text, no markdown.`, 4000);
    return { text:this.json(t).body, source:'claude' };
  },
};

/* ============ Demo workspace ============ */

  const h = (location.hash || '#/').slice(2).split('/');

}

      if (v.status === 'pending' && isGov(m, uid) && v.requestedBy !== uid) t.push({ kind:'Decide', icon:'flag', b:'b-orange', m, title:`${dept(v.deptId).name}: ${VK[v.kind].l} on ${n[v.clauseId]}`, sub:m.title, link:L(m) + '/t/variations' });
      if (v.status === 'returned' && v.requestedBy === uid) t.push({ kind:'Revise', icon:'undo', b:'b-red', m, title:`Returned: ${VK[v.kind].l} on ${n[v.clauseId]}`, sub:m.title, link:L(m) + '/t/variations' });
    });
  });
  return t.sort((a, b) => (a.due || 9e15) - (b.due || 9e15));
}

/* ---------- Render ---------- */
let _lastRoute = '';
function render() {
  const r = route();
  const key = location.hash;
  document.getElementById('root').innerHTML = shell(r);
  const v = $('#view');
  try {
    if (r.page === 'dashboard') v.innerHTML = viewDashboard();
    else if (r.page === 'manuals') v.innerHTML = viewLibrary();
    else if (r.page === 'new') { v.innerHTML = viewNew(); }
    else if (r.page === 'inbox') v.innerHTML = viewInbox();
    else if (r.page === 'writing') v.innerHTML = viewWriting();
    else if (r.page === 'compliance') v.innerHTML = viewCompliance(r.sub);
    else if (r.page === 'depts') v.innerHTML = viewDepts(r.id);
    else if (r.page === 'settings') v.innerHTML = viewSettings();
    else if (r.page === 'manual') { const m = manual(r.id); v.innerHTML = m ? viewManual(m, r) : '<div class="empty"><div class="h2">Manual not found</div></div>'; m && mountManual(m, r); }
    else v.innerHTML = '<div class="empty"><div class="h2">Page not found</div></div>';
  } catch (e) { console.error(e); v.innerHTML = `<div class="note bad">Something went wrong rendering this page: ${esc(e.message)}</div>`; }
  if (key !== _lastRoute) { window.scrollTo(0, 0); _lastRoute = key; }
}
function rerender() { const y = window.scrollY; const ts = $('.tree .list')?.scrollTop, rs = $('.rail .list')?.scrollTop; render(); window.scrollTo(0, y); if (ts != null && $('.tree .list')) $('.tree .list').scrollTop = ts; if (rs != null && $('.rail .list')) $('.rail .list').scrollTop = rs; }
function commit(msg, kind) { save(); rerender(); if (msg) toast(msg, kind || 'good'); }

/* ---------- Global actions (shell) ---------- */
const A = {
  actAs(id) { S.me = id; UI.bell = false; save(); render(); toast(`Now acting as ${uname(id)}`); },
  theme() { const d = document.documentElement; const cur = d.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); d.dataset.theme = cur === 'dark' ? 'light' : 'dark'; S.theme = d.dataset.theme; save(); rerender(); },
  bell(e) { e.stopPropagation(); UI.bell = !UI.bell; rerender(); },
  readAll() { S.notifications.forEach(n => { if (n.userId === S.me) n.read = true; }); save(); rerender(); },
  openNtf(id) { const n = S.notifications.find(x => x.id === id); n.read = true; UI.bell = false; save(); go(n.link || '#/'); },
  palette() {
    modal({ title:'', body:'', onMount(){} });
    const sc = $('#overlay .scrim'); sc.style.placeItems = 'start center';
    sc.innerHTML = `<div class="modal cmdk"><input id="cmdq" placeholder="Search manuals, clauses, people, pages…" autofocus><div class="res" id="cmdr"></div></div>`;
    sc.onmousedown = e => { if (e.target === sc) closeModal(); };
    let sel = 0, items = [];
    const draw = () => {
      const q = $('#cmdq').value.trim().toLowerCase();
      const pages = [['Dashboard','#/','dashboard'],['My Work','#/inbox','inbox'],['Manual Library','#/manuals','layers'],['New Manual (AI)','#/new','sparkles'],['Department Standards','#/depts','building'],['Settings','#/settings','settings']].map(([t, l, i]) => ({ t, l, i, s:'Page' }));
      const ms = S.manuals.map(m => ({ t:m.title, l:L(m), i:'book', s:`${m.code} · ${STAGES[stageIdx(m.stage)].l}` }));
      const cs = []; S.manuals.forEach(m => { const n = nums(m); m.clauses.forEach(c => cs.push({ t:`${n[c.id]}  ${c.title}`, l:L(m, c), i:'list', s:m.title, body:c.body })); });
      items = (q ? [...pages, ...ms, ...cs].filter(x => (x.t + ' ' + x.s + ' ' + (x.body || '')).toLowerCase().includes(q)) : [...pages, ...ms]).slice(0, 40);
      sel = Math.min(sel, items.length - 1);
      $('#cmdr').innerHTML = items.length ? items.map((x, i) => `<div class="r ${i === sel ? 'on' : ''}" data-i="${i}">${ic(x.i)}<div class="grow"><div style="font-weight:600">${esc(x.t)}</div><div class="xs muted">${esc(x.s)}</div></div>${i === sel ? '<kbd>Enter</kbd>' : ''}</div>`).join('') : '<div class="empty">No results</div>';
      $$('#cmdr .r').forEach(el => el.onclick = () => { closeModal(); go(items[+el.dataset.i].l); });
    };
    $('#cmdq').oninput = () => { sel = 0; draw(); };
    $('#cmdq').onkeydown = e => { if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, items.length - 1); draw(); e.preventDefault(); } if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); draw(); e.preventDefault(); } if (e.key === 'Enter' && items[sel]) { closeModal(); go(items[sel].l); } if (e.key === 'Escape') closeModal(); };
    draw(); $('#cmdq').focus();
  },
};

/* ---------- Boot ---------- */
function boot() {
  S = loadState() || seedState();
  document.documentElement.dataset.theme = S.theme || 'light';
  sweep(); save();
  window.addEventListener('hashchange', () => { UI.bell = false; render(); });
  document.addEventListener('click', () => { if (UI.bell) { UI.bell = false; rerender(); } });
  document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); A.palette(); } if (e.key === 'Escape' && $('#overlay').innerHTML) closeModal(); });
  setInterval(() => { if (sweep()) rerender(); }, 60000);
  render();
}

function donut(segs, size = 150, th = 20, label = '', sub = '') {
  const r = (size - th) / 2, C = 2 * Math.PI * r, cx = size / 2, tot = segs.reduce((s, x) => s + x.v, 0) || 1; let off = 0;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--line2)" stroke-width="${th}"/>
  ${segs.filter(s => s.v).map(s => { const len = s.v / tot * C; const el = `<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${s.c}" stroke-width="${th}" stroke-dasharray="${Math.max(len - 2, 0.1)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cx})"><title>${s.l}: ${s.v}</title></circle>`; off += len; return el; }).join('')}
  <text x="50%" y="48%" text-anchor="middle" style="font:500 28px var(--serif);fill:var(--ink)">${label}</text><text x="50%" y="62%" text-anchor="middle" style="font:600 10px var(--sans);fill:var(--muted);letter-spacing:1px">${sub}</text></svg>`;
}

/* ---------------- Page actions ---------------- */
Object.assign(A, {
  wset(k, v, re) { wiz()[k] = v; if (re) rerender(); },
  wtype(id) { const w = wiz(), t = KB.TYPES.find(x => x.id === id); w.type = id; if (t.id !== 'custom') { w.title = t.name; w.refs = t.refs.slice(); } w.code = { safety:'HSE-MAN-', environment:'ENV-MAN-', quality:'QMS-MAN-', emergency:'ERS-STD-', risk:'RSK-STD-', custom:'DOC-' }[id] + String(S.manuals.length + 1).padStart(3, '0'); rerender(); },
  wref(r) { const w = wiz(); w.refs = w.refs.includes(r) ? w.refs.filter(x => x !== r) : [...w.refs, r]; rerender(); },
  async generate() {
    const w = wiz(); if (!w.title.trim()) return toast('Add a title', 'bad');
    UI.busy = true; w.preview = null; rerender();
    try {
      const t0 = now();
      const r = await AI.generate({ type:w.type, typeName:(KB.TYPES.find(x => x.id === w.type) || {}).name, title:w.title, company:w.company, description:w.description, refs:w.refs, depth:w.depth });
      if (r.source === 'offline') await new Promise(res => setTimeout(res, Math.max(0, 1400 - (now() - t0))));
      if (!r.tree.length) throw new Error('Empty structure returned');
      w.preview = r.tree; w.source = r.source;
    } catch (e) { toast('AI generation failed: ' + e.message + ' — using offline engine', 'bad'); w.preview = KB.generate({ type:w.type, company:w.company, refs:w.refs, description:w.description, title:w.title }); w.source = 'offline'; }
    UI.busy = false; rerender();
  },
  createFromPreview() {
    const w = wiz(); const m = newManual({ title:w.title, type:w.type, code:w.code, company:w.company, description:w.description, references:w.refs.slice() });
    m.clauses = treeToClauses(w.preview); S.manuals.unshift(m);
    log(m, `created the manual with AI (${w.source === 'claude' ? 'Claude' : 'offline engine'}) — ${m.clauses.length} clauses`);
    UI.wizard = null; save(); go(L(m)); toast('Manual created — start assigning clauses', 'good');
  },
  createBlank() {
    const w = wiz(); if (!w.title.trim()) return toast('Add a title', 'bad');
    const m = newManual({ title:w.title, type:w.type, code:w.code, company:w.company, references:w.refs.slice() });
    const c = newClause({ title:'Purpose & Scope' }); m.clauses.push(c); S.manuals.unshift(m);
    log(m, 'created the manual'); UI.wizard = null; save(); go(L(m, c));
  },
  delManual(mid) { const m = manual(mid); ask({ title:'Delete ' + esc(m.title) + '?', label:'Type DELETE to permanently remove this manual and all its clauses', ok:'Delete', okCls:'danger fill' }, v => { if (v !== 'DELETE') return toast('Not deleted', 'bad'); S.manuals = S.manuals.filter(x => x.id !== mid); log(null, 'deleted manual ' + m.title); commit('Manual deleted'); }); },
  set(k, v) { S.settings[k] = v; save(); if (['apiKey','model','governanceDeptId'].includes(k)) rerender(); toast('Saved', 'good'); },
  deptSet(id, k, v) { dept(id)[k] = v; save(); toast('Saved', 'good'); },
  userSet(id, k, v) { user(id)[k] = v; save(); rerender(); },
  addDept() { ask({ title:'Add department', label:'Department name', ok:'Add' }, v => { const id = v.replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase() + (S.departments.length + 1); S.departments.push({ id, name:v, headId:S.me }); commit('Department added'); }); },
  addUser() { ask({ title:'Add person', label:'Full name', ok:'Add' }, v => { S.users.push({ id:uid('u'), name:v, title:'Team member', deptId:S.departments[0].id, color:AV_COLORS[S.users.length % AV_COLORS.length] }); commit('Person added'); }); },
  async testAI(btn) { if (!AI.hasKey()) return toast('Add an API key first', 'bad'); btn.innerHTML = '<span class="spin"></span> Testing…'; try { const t = await AI.call('Reply with JSON only.', 'Return {"ok":true}', 200); toast('Claude responded: ' + t.slice(0, 40), 'good'); } catch (e) { toast('Connection failed: ' + e.message, 'bad'); } btn.innerHTML = ic('zap') + ' Test connection'; },
  exportData() { const b = new Blob([JSON.stringify({ ...S, settings:{ ...S.settings, apiKey:'' } }, null, 2)], { type:'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'canon-workspace-' + isoDate(now()) + '.json'; a.click(); },
  importData(inp) { const f = inp.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const j = JSON.parse(r.result); if (!j.manuals || !j.users) throw new Error('Not a Canon workspace file'); const key = S.settings.apiKey; S = j; S.settings.apiKey = S.settings.apiKey || key; commit('Workspace imported'); } catch (e) { toast(e.message, 'bad'); } }; r.readAsText(f); },
  resetDemo() { ask({ title:'Reset to demo data?', label:'Type RESET to replace all data in this browser with the demo workspace', ok:'Reset', okCls:'danger fill' }, v => { if (v !== 'RESET') return toast('Not reset', 'bad'); const key = S.settings.apiKey; seedState(); S.settings.apiKey = key; commit('Demo data restored'); go('#/'); }); },
});

/* ---------------- Writing: every clause you must write, until it is fully approved ---------------- */
const W_ST = {
  not_started:{ cls:'p-amb', l:'To write', act:true, btn:'Write' },
  in_progress:{ cls:'p-lav', l:'In progress', act:true, btn:'Continue' },
  changes_requested:{ cls:'p-red', l:'Needs revision', act:true, btn:'Revise' },
  submitted:{ cls:'p-gry', l:'Submitted', act:false, btn:'View' },
};
function myWritingItems() {
  const out = [];
  S.manuals.filter(m => m.stage === 'drafting').forEach(m => {
    m.clauses.forEach(c => {
      const mineDirect = c.assigneeId === S.me && !ancestors(m, c).some(a => a.assigneeId === S.me);
      const mineOwner = isOwner(m) && !c.parentId && !c.assigneeId;
      if ((mineDirect || mineOwner) && c.status !== 'approved') out.push({ m, c });
    });
  });
  const order = { changes_requested:0, not_started:1, in_progress:2, submitted:3 };
  return out.sort((a, b) => order[a.c.status] - order[b.c.status] || (a.c.deadline || 9e15) - (b.c.deadline || 9e15));
}
function viewWriting() {
  const by = {}; myWritingItems().forEach(x => (by[x.m.id] = by[x.m.id] || { m:x.m, cs:[] }).cs.push(x.c));
  const groups = Object.values(by).map(g => {
    const st = g.cs.map(c => c.status);
    const key = st.includes('changes_requested') ? 'changes_requested' : st.includes('not_started') ? 'not_started' : st.includes('in_progress') ? 'in_progress' : 'submitted';
    const todo = g.cs.filter(c => W_ST[c.status].act), next = Math.min(...todo.map(c => c.deadline || 9e15));
    const rvs = [...new Set(g.cs.filter(c => c.status === 'submitted').map(c => c.reviewerId || reviewerOf(g.m, c)).filter(Boolean))];
    const firstTodo = g.cs.find(c => c.status === 'changes_requested') || todo[0] || g.cs[0];
    return { ...g, key, todo, next, rvs, by:[...new Set(g.cs.map(c => c.assignedById || g.m.ownerId))], first:firstTodo, ret:g.cs.filter(c => c.status === 'changes_requested').length };
  }).sort((a, b) => ({ changes_requested:0, not_started:1, in_progress:2, submitted:3 }[a.key] - { changes_requested:0, not_started:1, in_progress:2, submitted:3 }[b.key]) || a.next - b.next);
  const act = groups.filter(g => W_ST[g.key].act).length;
  const sortI = '<svg class="i sm srt" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z" fill="currentColor" stroke="none"/></svg>';
  const rows = groups.map((g, i) => {
    const { m, cs, key, todo, next, rvs, ret } = g, s = W_ST[key], link = `#/m/${m.id}/c/${g.first.id}`, di = next < 9e15 ? dueInfo(next) : null;
    const p = Math.round(cs.reduce((a, c) => a + ST[c.status].p, 0) / Math.max(1, cs.length));
    const label = key === 'submitted' ? `Submitted to ${esc(rvs.map(u => uname(u).split(' ')[0]).join(', ') || 'owner')}` : key === 'changes_requested' ? `Needs revision${ret > 1 ? ' · ' + ret : ''}` : s.l;
    return `<tr class="click ${s.act ? '' : 'muted-row'}" onclick="go('${link}')"><td>${i + 1}</td>
      <td style="min-width:170px"><b>${esc(m.title)}</b><div class="bar mt8" style="height:4px;max-width:160px" title="${p}% done"><i style="width:${p}%;background:var(--accent)"></i></div></td>
      <td class="nowrap small">${esc(m.code)}</td>
      <td><span class="pill p-tan">${cs.length} clause${cs.length === 1 ? '' : 's'}</span>${todo.length && todo.length < cs.length ? `<div class="xs muted" style="margin-top:3px">${todo.length} to finish</div>` : ''}</td>
      <td><div class="row">${g.by.map(u => av(u, 'sm')).join('')}<span class="small">${esc(g.by.map(u => uname(u)).join(', '))}</span></div></td>
      <td>${di ? `<span class="badge ${di.cls}">${di.t}</span>` : '<span class="xs muted">—</span>'}</td>
      <td><span class="pill ${s.cls}">${label}</span></td>
      <td class="acts nowrap" onclick="event.stopPropagation()"><a class="btn xs ${s.act ? 'acc' : ''}" href="${link}">${ic(s.act ? 'edit' : 'eye', 'sm')} ${s.btn}</a></td></tr>`;
  }).join('');
  return `<div class="pagehead"><div class="grow"><h1 class="h1">Writing</h1><p>Manuals where you have clauses to write. Each one stays here until everything you wrote in it is approved.</p></div>${act ? `<span class="pill p-amb">${act} need${act === 1 ? 's' : ''} action</span>` : ''}</div>
  <div class="card ltable"><div style="overflow-x:auto"><table class="tbl">
    <thead><tr><th>ID ${sortI}</th><th>Manual Title ${sortI}</th><th>Document Code</th><th>Assigned</th><th>Assigned By</th><th>Deadline ${sortI}</th><th>Status ${sortI}</th><th></th></tr></thead>
    <tbody>${rows || '<tr><td colspan="8" class="empty">Nothing to write — everything assigned to you is approved.</td></tr>'}</tbody></table></div></div>
  <div class="legend mt12"><span><i style="background:#F5C46B"></i>To write</span><span><i style="background:#A5A1FF"></i>In progress</span><span><i style="background:#F09B9B"></i>Needs revision</span><span><i style="background:#D1D5DB"></i>Submitted — waiting for your manager</span></div>`;
}
function myWritingCount() { try { const s = new Set(); myWritingItems().forEach(x => { if (W_ST[x.c.status].act) s.add(x.m.id); }); return s.size; } catch (e) { return 0; } }

/* ============ Manual workspace ============ */
const canAssign = (m, c) => (m.stage === 'setup' && isOwner(m)) || (m.stage === 'drafting' && (isOwner(m) || controls(m, c) || (c.parentId && controls(m, clause(m, c.parentId)))));
const canStructure = (m, c) => (m.stage === 'setup' && isOwner(m)) || (m.stage === 'drafting' && (c ? controls(m, c) : isOwner(m))) || (isOwner(m) && (m.stage === 'dept_review' || (m.stage === 'approval' && m.approval?.status === 'returned')));
const canDelete = (m, c) => (m.stage === 'setup' && isOwner(m)) || (m.stage === 'drafting' && (isOwner(m) || (c.parentId && controls(m, clause(m, c.parentId)))));
const openConf = (m, cid) => (m.conflicts || []).filter(x => x.status === 'open' && (!cid || x.clauseId === cid));

function highlight(text, marks) {
  const ranges = [];
  marks.forEach(mk => {
    if (!mk.quote) return; let i = text.indexOf(mk.quote); if (i < 0) i = text.toLowerCase().indexOf(mk.quote.toLowerCase()); if (i < 0) return;
    const r = { s:i, e:i + mk.quote.length, mk }; if (ranges.some(x => r.s < x.e && x.s < r.e)) return; ranges.push(r);
  });
  ranges.sort((a, b) => a.s - b.s); let out = '', p = 0;
  ranges.forEach(r => { out += esc(text.slice(p, r.s)) + `<mark class="${r.mk.cls}" data-k="${r.mk.id}" onclick="A.focusMark('${r.mk.id}','${r.mk.kind}')" ${r.mk.title ? `title="${esc(r.mk.title)}"` : ''}>${esc(text.slice(r.s, r.e))}</mark>`; p = r.e; });
  return out + esc(text.slice(p));
}

/* ---------------- Compliance tab ---------------- */
function tabConflicts(m) {
  const all = m.conflicts || [], open = all.filter(x => x.status === 'open'), dis = all.filter(x => x.status === 'dismissed');
  const by = s => open.filter(x => x.severity === s).length;
  return `<div class="grid3 mb16"><div class="card pad" style="grid-column:span 2"><div class="row gap16"><div style="color:var(--accent)">${ic('sparkles', 'lg')}</div><div class="grow"><h3>AI compliance check</h3><div class="small muted">Every clause and every MIN/MAX limit is compared against <b>${esc(m.references.join(', '))}</b>. Statements that contradict or are weaker than the references are highlighted inside the text with a red wavy underline.</div>
    <div class="xs muted mt8">${m.conflictsAt ? `Last checked ${rel(m.conflictsAt)} · ${m.conflictsSource === 'claude' ? 'Claude' : 'offline engine'}` : 'Not checked yet'}</div></div><button class="btn ai-btn" onclick="A.check('${m.id}',this)">${ic('sparkles')} Run check</button></div></div>
    <div class="card pad"><div class="eyebrow">Open findings</div><div class="row mt8"><div class="h1">${open.length}</div><div class="col gap4 right small"><span class="badge b-red">${by('high')} high</span><span class="badge b-amber">${by('medium')} medium</span><span class="badge b-blue">${by('low')} low</span></div></div></div></div>
  ${open.length ? `<div class="grid2">${open.sort((a, b) => ['high','medium','low'].indexOf(a.severity) - ['high','medium','low'].indexOf(b.severity)).map(x => conflictCard(m, x)).join('')}</div>` : `<div class="card empty">${ic('shield', 'lg')}<div class="h2 mt8">No open conflicts</div>${m.conflictsAt ? 'The manual is consistent with its references.' : 'Run the check to compare the manual with its references.'}</div>`}
  ${dis.length ? `<div class="mt24"><div class="eyebrow mb8">Dismissed (${dis.length})</div>${dis.map(x => `<div class="note small mb8"><b>${esc(x.reference)}</b> — “${esc(x.quote)}” <span class="muted">· dismissed by ${esc(uname(x.dismissedBy))}: ${esc(x.reason || '')}</span></div>`).join('')}</div>` : ''}`;
}

/* ---------------- Approval tab ---------------- */
function tabApproval(m) {
  const ap = m.approval;
  if (!ap) {
    const allOk = m.stage === 'approval';
    if (!allOk || !isOwner(m)) return `<div class="card pad"><h3>Approval chain</h3><p class="small muted">The approval chain starts after all departments accept the manual. Each approver signs in sequence with their own deadline; the owner can delegate, escalate or skip a step.</p></div>`;
    const ch = UI.chain || (UI.chain = [
      { userId:deptHead(m.governanceDeptId || S.settings.governanceDeptId) === m.ownerId ? 'u2' : deptHead(S.settings.governanceDeptId), role:'Technical Review', days:3 },
      { userId:deptHead('OPS') || S.users[1].id, role:'Operations Approval', days:3 },
      { userId:deptHead('EXE') || S.users[0].id, role:'Final Authorisation', days:5 }].filter(x => user(x.userId)));
    return `<div class="card"><div class="hd"><h3>Build the approval chain</h3><span class="small muted">Approvers sign in this order. Each gets their own deadline.</span></div><div class="bd">
      <div class="chain">${ch.map((s, i) => `<div class="link"><div class="node">${i + 1}</div><div class="grid3" style="grid-template-columns:2fr 2fr 1fr"><div><label class="lbl">Approver</label><select class="select" onchange="UI.chain[${i}].userId=this.value">${userOpts(s.userId)}</select></div><div><label class="lbl">Role / signature</label><input class="input" value="${esc(s.role)}" onchange="UI.chain[${i}].role=this.value"></div><div><label class="lbl">Days</label><input class="input mono" type="number" min="1" value="${s.days}" onchange="UI.chain[${i}].days=+this.value"></div></div>
        <div class="row" style="padding-top:22px"><button class="btn sm ghost" onclick="A.chainMove(${i},-1)">${ic('arrowup', 'sm')}</button><button class="btn sm ghost" onclick="A.chainMove(${i},1)">${ic('arrowdown', 'sm')}</button><button class="btn sm ghost" onclick="UI.chain.splice(${i},1);rerender()">${ic('trash', 'sm')}</button></div></div>`).join('')}</div>
      <div class="row"><button class="btn" onclick="UI.chain.push({userId:'${S.users[0].id}',role:'Approver',days:3});rerender()">${ic('plus')} Add approver</button><span class="grow"></span><button class="btn acc" onclick="A.startChain('${m.id}')">${ic('send')} Start approval chain</button></div></div></div>`;
  }
  const pend = ap.steps.find(s => s.status === 'pending');
  const banner = ap.status === 'returned' ? `<div class="note bad mb16 row wrap"><span class="grow">${ic('undo', 'sm')} Returned by <b>${esc(uname(ap.steps.find(s => s.status === 'returned')?.signedBy || ap.steps.find(s => s.status === 'returned')?.userId))}</b>: “${esc(ap.steps.find(s => s.status === 'returned')?.comment)}”. The owner can now edit clauses and resubmit.</span>${isOwner(m) && !(m.proposals || []).some(p => p.status === 'pending') ? `<button class="btn sm acc" onclick="A.resubmit('${m.id}')">${ic('send', 'sm')} Resubmit for approval</button>` : ''}</div>`
    : ap.status === 'complete' && m.stage === 'approval' ? `<div class="note good mb16 row wrap"><span class="grow">${ic('check', 'sm')} All approvers signed. ${isOwner(m) ? 'Publish to issue the manual to every department.' : 'Waiting for the owner to publish.'}</span>${isOwner(m) && !(m.proposals || []).some(p => p.status === 'pending') ? `<button class="btn sm ok" onclick="A.publish('${m.id}')">${ic('book', 'sm')} Publish v${parseFloat(m.version) < 1 ? '1.0' : Math.floor(parseFloat(m.version)) + 1 + '.0'}</button>` : ''}</div>`
    : m.stage === 'published' ? `<div class="note good mb16 row wrap"><span class="grow">${ic('book', 'sm')} Published v${m.version} on ${fmtD(m.publishedAt)}.</span>${isOwner(m) ? `<button class="btn sm" onclick="A.revise('${m.id}')">${ic('git', 'sm')} Start new revision</button>` : ''}</div>` : '';

        ${s.comment ? `<div class="small mt8" style="font-style:italic">“${esc(s.comment)}”</div>` : ''}
        ${s.history.length ? `<div class="xs muted mt8">${s.history.slice(-3).map(h => `${esc(h.text)} · ${rel(h.ts)}`).join('<br>')}</div>` : ''}

  </div></div></div>

    <div class="divider"></div><div class="xs muted">Escalation contact: <b>${esc(uname(S.settings.escalationUserId))}</b> · auto-escalate ${S.settings.autoEscalate ? 'on' : 'off'} (Settings)</div></div></div></div>`;
}

/* ---------------- Department requests (variations) tab ---------------- */

  return `<div class="card pad mb16"><div class="row wrap gap16"><div class="grow"><h3>Department requests</h3><div class="small muted">Departments open their edition of the book and suggest changes — wording, mandatory points, timelines, stricter limits or not-applicable. Each request shows the exact before/after. Decisions by <b>${esc(gov.name)}</b> <a class="muted" href="#/settings">(Settings)</a>. Departments can be better than the standard, never worse.</div></div>

    ${m.stage === 'published' ? `<button class="btn acc" onclick="A.openSuggest('${m.id}')">${ic('book')} Open my edition & request variations</button>` : ''}</div></div>

    return `<div class="card pad"><div class="row wrap"><span class="badge ${VK[v.kind].b} plain">${ic(VK[v.kind].i, 'sm')} ${VK[v.kind].l}</span><b>${esc(dept(v.deptId).name)}</b><span class="mono small muted">${n[v.clauseId]}</span><a href="${L(m, c)}" class="small">${esc(c?.title || '')}</a><span class="right">${varStatus(v)}</span></div>
      ${v.kind === 'tighten' && rq ? `<div class="row mt12 gap12"><span class="small muted">${esc(rq.q.label)}</span><span class="ty ${rq.q.type} badge plain">${rq.q.type.toUpperCase()}</span><span class="h2" style="font-size:18px;text-decoration:line-through;color:var(--muted)">${rq.q.value}</span>${ic('chev')}<span class="h2" style="font-size:22px;color:var(--accent)">${v.proposed}</span><span class="small">${esc(rq.q.unit)}</span></div>` : ''}
      ${v.kind === 'add' ? `<div class="note mt12 small">${esc(v.text)}</div>` : ''}${v.kind === 'edit' ? editSummary(m, v) : ''}
      <div class="small mt12"><span class="muted">Justification:</span> ${esc(v.justification)}</div>
      <div class="row mt12 wrap">${av(v.requestedBy, 'sm')}<span class="xs muted">${esc(uname(v.requestedBy))} · ${rel(v.ts)}</span>${v.decidedBy ? `<span class="xs muted">· ${v.status} by ${esc(uname(v.decidedBy))}${v.comment ? ': “' + esc(v.comment) + '”' : ''}</span>` : ''}
        <span class="right row">${v.kind === 'edit' ? `<button class="btn sm ${v.status === 'pending' && isGov(m) && v.requestedBy !== S.me ? 'acc' : ''}" onclick="A.reviewReq('${m.id}','${v.id}')">${ic('eye', 'sm')} ${v.status === 'pending' && isGov(m) && v.requestedBy !== S.me ? 'Review changes' : 'View changes'}</button>` : ''}${v.kind !== 'edit' && v.status === 'pending' && isGov(m) && v.requestedBy !== S.me ? `<button class="btn sm ok" onclick="A.decide('${m.id}','${v.id}','approve')">${ic('check', 'sm')} Approve</button><button class="btn sm danger" onclick="A.decide('${m.id}','${v.id}','return')">${ic('undo', 'sm')} Return</button>` : ''}

function tabActivity(m) {

/* ---------------- Workspace actions ---------------- */
const MC = (mid, cid) => { const m = manual(mid); return [m, cid ? clause(m, cid) : null]; };
Object.assign(A, {
  renameManual(mid) { const m = manual(mid); ask({ title:'Rename manual', label:'Title', value:m.title, ok:'Save' }, v => { m.title = v; log(m, 'renamed the manual'); commit('Renamed'); }); },
  editRefs(mid) { const m = manual(mid); ask({ title:'Reference standards', label:'One per line — the AI compliance check uses these', value:m.references.join('\n'), ok:'Save' }, v => { m.references = v.split('\n').map(x => x.trim()).filter(Boolean); log(m, 'updated reference standards'); commit('References updated'); }); },
  mode(cid, md) { UI.mode[cid] = md; rerender(); },
  cset(mid, cid, k, v) { const [m, c] = MC(mid, cid); c[k] = v; touchClause(c); save(); rerender(); },
  body(mid, cid, v) { const [m, c] = MC(mid, cid); c.body = v; touchClause(c); save(); },
  lint(mid, cid) {
    const [m, c] = MC(mid, cid); const before = openConf(m, cid);
    m.conflicts = (m.conflicts || []).filter(x => !(x.clauseId === cid && x.status === 'open' && x.rule !== 'req' && !c.body.includes(x.quote)));
    const found = KB.check(m, [c], nums(m)).filter(x => !m.conflicts.some(y => y.clauseId === cid && y.quote === x.quote));
    found.forEach(x => m.conflicts.push({ id:uid('f'), ...x, status:'open' }));
    save(); if (found.length) { toast(`⚠ ${found.length} possible conflict${found.length > 1 ? 's' : ''} with ${found[0].reference}`, 'bad'); rerender(); } else if (before.length !== openConf(m, cid).length) rerender();
  },
  reqAdd(mid, cid) { const [m, c] = MC(mid, cid); c.requirements.push({ id:uid('q'), label:'New limit', type:'max', value:1, unit:'days' }); commit(); },
  reqSet(mid, cid, rid, k, v) { const [m, c] = MC(mid, cid); c.requirements.find(q => q.id === rid)[k] = v; touchClause(c); save(); },
  reqDel(mid, cid, rid) { const [m, c] = MC(mid, cid); c.requirements = c.requirements.filter(q => q.id !== rid); commit(); },
  ptAdd(mid, cid) { const [m, c] = MC(mid, cid); c.steps.push(''); commit(); setTimeout(() => { const l = $$('.points input'); l[l.length - 1]?.focus(); }, 30); },
  ptSet(mid, cid, i, v) { const [m, c] = MC(mid, cid); c.steps[i] = v; touchClause(c); save(); },
  ptDel(mid, cid, i) { const [m, c] = MC(mid, cid); c.steps.splice(i, 1); commit(); },
  actAdd(mid, cid) { const [m, c] = MC(mid, cid); const last = c.actions[c.actions.length - 1]; c.actions.push({ id:uid('a'), offset:last ? last.offset + 1 : 0, unit:last ? last.unit : 'days', action:'', owner:'' }); commit(); },
  actSet(mid, cid, aid, k, v) { const [m, c] = MC(mid, cid); c.actions.find(a => a.id === aid)[k] = v; touchClause(c); save(); if (k !== 'action' && k !== 'owner') rerender(); },
  actDel(mid, cid, aid) { const [m, c] = MC(mid, cid); c.actions = c.actions.filter(a => a.id !== aid); commit(); },
  assign(mid, cid) {
    const [m, c] = MC(mid, cid); const dl = c.deadline || now() + S.settings.defaultClauseDays * DAY;
    modal({ title:`Assign ${nums(m)[c.id]} ${esc(c.title)}`, body:`<div class="field"><label class="lbl">Responsible person</label><select class="select" id="as-u"><option value="">— Unassigned —</option>${userOpts(c.assigneeId)}</select></div>
      <div class="field"><label class="lbl">Deadline</label><input class="input" type="date" id="as-d" value="${isoDate(dl)}"></div>
      <div class="note small">The assignee gets a notification, full control over this clause and its sub-clauses (write, add, delegate), and submits back to <b>you</b> for review.</div>`,
      foot:`<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn pri" id="as-ok">Assign</button>` });
    $('#as-ok').onclick = () => { assignClause(m, c, $('#as-u').value, fromIso($('#as-d').value)); closeModal(); commit($('#as-u') ? 'Assigned' : 'Assigned'); };
  },
  addSub(mid, pid) {
    const m = manual(mid); const p = pid ? clause(m, pid) : null; const n = nums(m);
    const nextNum = p ? (n[p.id].endsWith('.0') ? n[p.id].slice(0, -2) : n[p.id]) + '.' + (kids(m, pid).length + 1) : (kids(m, null).length + 1) + '.0';
    modal({ title:`Add clause ${nextNum}`, body:`<div class="field"><label class="lbl">Title</label><input class="input" id="ns-t" placeholder="e.g. Incident Investigation" autofocus></div>
      <div class="grid2"><div class="field"><label class="lbl">Assign to (optional)</label><select class="select" id="ns-u"><option value="">— Keep with me —</option>${userOpts('')}</select></div><div class="field"><label class="lbl">Deadline</label><input class="input" type="date" id="ns-d" value="${isoDate(now() + S.settings.defaultClauseDays * DAY)}"></div></div>
      <div class="row"><input type="checkbox" id="ns-ai"><label for="ns-ai" class="small">Draft the text with AI</label></div>`,
      foot:`<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn pri" id="ns-ok">Add clause</button>` });
    $('#ns-t').onkeydown = e => { if (e.key === 'Enter') $('#ns-ok').click(); };
    $('#ns-ok').onclick = async () => {
      const t = $('#ns-t').value.trim(); if (!t) return $('#ns-t').focus();
      const c = newClause({ parentId:pid || null, order:kids(m, pid || null).length, title:t }); m.clauses.push(c);
      const u = $('#ns-u').value, d = fromIso($('#ns-d').value), useAi = $('#ns-ai').checked;
      c.history.push({ ts:now(), userId:S.me, text:'Clause created' });
      if (p && p.status === 'approved') reopenClause(m, p);
      if (u) assignClause(m, c, u, d); else if (d && p) c.deadline = d;
      log(m, `added clause ${nums(m)[c.id]} ${t}`); closeModal();
      if (useAi) { try { c.body = (await AI.draft(m, c)).text; } catch (e) { c.body = KB.draftClause(t, { company:m.company, refs:m.references }); } }
      save(); if (m.stage === 'setup') rerender(); else go(L(m, c));
    };
  },
  delClause(mid, cid) {
    const [m, c] = MC(mid, cid); const d = descendants(m, cid);
    ask({ title:`Delete ${nums(m)[cid]} ${esc(c.title)}?`, label:`Reason (this also deletes ${d.length} sub-clause${d.length === 1 ? '' : 's'})`, ok:'Delete', okCls:'danger fill' }, v => {
      const ids = new Set([cid, ...d.map(x => x.id)]); m.clauses = m.clauses.filter(x => !ids.has(x.id)); m.conflicts = (m.conflicts || []).filter(x => !ids.has(x.clauseId));
      kids(m, c.parentId).forEach((k, i) => k.order = i); log(m, `deleted clause ${c.title}: ${v}`); delete UI.sel[mid]; save(); if (m.stage === 'setup') rerender(); else go(c.parentId ? L(m, clause(m, c.parentId)) : L(m)); toast('Clause deleted');
    });
  },
  move(mid, cid, dir) { const [m, c] = MC(mid, cid); const sib = kids(m, c.parentId); const i = sib.indexOf(c), j = i + dir; if (j < 0 || j >= sib.length) return; [sib[i].order, sib[j].order] = [sib[j].order, sib[i].order]; commit(); },
  submit(mid, cid) { const [m, c] = MC(mid, cid); const open = c.comments.filter(k => !k.resolved && k.authorId !== S.me).length; const go2 = () => { submitClause(m, c); commit(c.status === 'approved' ? 'Approved' : 'Submitted for review'); };
    if (open) ask({ title:'Open comments remain', label:`There ${open === 1 ? 'is 1 unresolved comment' : 'are ' + open + ' unresolved comments'}. Add a note for your reviewer (optional)`, ok:'Submit anyway', required:false }, v => { if (v) c.comments.push({ id:uid('k'), quote:'', text:v, authorId:S.me, ts:now(), resolved:false, replies:[], source:'review' }); go2(); }); else go2(); },
  approve(mid, cid) { const [m, c] = MC(mid, cid); approveClause(m, c); commit('Clause approved — it now rolls up to the next level'); },
  reqChanges(mid, cid) { const [m, c] = MC(mid, cid); const open = c.comments.filter(k => !k.resolved).length;
    ask({ title:'Request changes', label:open ? `Summary note (optional — ${open} highlighted comment${open > 1 ? 's' : ''} will be sent)` : 'What needs to change?', required:!open, ok:'Send back', okCls:'danger fill' }, v => { if (v) c.comments.push({ id:uid('k'), quote:'', text:v, authorId:S.me, ts:now(), resolved:false, replies:[], source:'review' }); returnClause(m, c, v); commit('Sent back with comments'); }); },
  reopen(mid, cid) { const [m, c] = MC(mid, cid); reopenClause(m, c); commit('Re-opened'); },
  async aiDraft(mid, cid, btn) {
    const [m, c] = MC(mid, cid); btn.innerHTML = '<span class="spin"></span> Drafting…'; btn.disabled = true;
    let r; try { r = await AI.draft(m, c); } catch (e) { toast('AI failed: ' + e.message, 'bad'); r = { text:KB.draftClause(c.title, { company:m.company, refs:m.references }), source:'offline' }; }
    modal({ title:`${ic('sparkles')} AI draft — ${esc(c.title)}`, body:`<div class="xs muted mb8">${r.source === 'claude' ? 'Generated by Claude' : 'Generated by the offline standards engine'}</div><textarea class="textarea doced" id="ai-t" rows="8">${esc(r.text)}</textarea>`,
      foot:`<button class="btn ghost" onclick="closeModal()">Discard</button>${c.body ? `<button class="btn" id="ai-ap">Append</button>` : ''}<button class="btn pri" id="ai-rp">${c.body ? 'Replace text' : 'Insert'}</button>` });
    const fin = t => { c.body = t; c.html = bodyHTML(t); touchClause(c); c.history.push({ ts:now(), userId:S.me, text:'Text drafted with AI' }); closeModal(); save(); A.lint(mid, cid); rerender(); };
    $('#ai-rp').onclick = () => fin($('#ai-t').value); if ($('#ai-ap')) $('#ai-ap').onclick = () => fin(c.body + '\n\n' + $('#ai-t').value);
    rerender();
  },
  newComment(mid, cid, general) {
    const [m, c] = MC(mid, cid); const q = general ? '' : (UI.quote || '');
    const dr = m.stage === 'dept_review' && m.deptReview.items.find(i => i.reviewerId === S.me);
    modal({ title:'Add comment', body:`${q ? `<div class="cmt" style="cursor:default"><div class="q" style="margin:0">“${esc(q)}”</div></div><div style="height:12px"></div>` : ''}<textarea class="textarea" id="cm-t" placeholder="Your comment…" autofocus></textarea>${dr ? `<div class="xs muted mt8">Posted as <b>${esc(dept(dr.deptId).name)}</b> department feedback.</div>` : ''}`,
      foot:`<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn pri" id="cm-ok">${ic('msg')} Comment</button>` });
    $('#cm-t').onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) $('#cm-ok').click(); };
    $('#cm-ok').onclick = () => {
      const t = $('#cm-t').value.trim(); if (!t) return;
      c.comments.push({ id:uid('k'), quote:q, text:t, authorId:S.me, ts:now(), resolved:false, replies:[], source:dr ? 'dept' : 'review', deptId:dr ? dr.deptId : null });
      const to = [responsibleFor(m, c), c.reviewerId, dr ? m.ownerId : null].filter(u => u && u !== S.me);
      notify(to, `${uname(S.me)} commented on ${nums(m)[c.id]} “${c.title}”: ${t.slice(0, 80)}`, L(m, c), 'comment');
      UI.quote = ''; UI.railTab = 'comments'; UI.cmtFilter = 'open'; UI.rTab = 'comments'; closeModal(); commit('Comment added');
    };
  },
  reply(mid, cid, kid, inp) { const [m, c] = MC(mid, cid); const t = inp.value.trim(); if (!t) return; const k = c.comments.find(x => x.id === kid); k.replies.push({ authorId:S.me, text:t, ts:now() }); if (k.authorId !== S.me) notify(k.authorId, `${uname(S.me)} replied on ${nums(m)[c.id]}: ${t.slice(0, 80)}`, L(m, c), 'comment'); commit(); },
  resolve(mid, cid, kid) { const [m, c] = MC(mid, cid); const k = c.comments.find(x => x.id === kid); k.resolved = !k.resolved; k.resolvedBy = S.me; commit(k.resolved ? 'Resolved' : 'Re-opened'); },
  flashMark(id) { const mk = $(`mark[data-k="${id}"]`); if (mk) { mk.scrollIntoView({ behavior:'smooth', block:'center' }); mk.classList.add('act'); setTimeout(() => mk.classList.remove('act'), 1600); } else { const c = route(); if (c.cid && UI.mode[c.cid] !== 'read') { UI.mode[c.cid] = 'read'; rerender(); setTimeout(() => A.flashMark(id), 50); } } },
  focusMark(id, kind) { UI.railTab = kind === 'f' ? 'conf' : 'comments'; if (kind === 'c') UI.cmtFilter = 'all'; rerender(); const el = $(`#${kind === 'f' ? 'cf' : 'cmt'}-${id}`); if (el) { el.scrollIntoView({ behavior:'smooth', block:'nearest' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1600); } },
  async check(mid, btn) {
    const m = manual(mid); const orig = btn ? btn.innerHTML : ''; if (btn) { btn.innerHTML = '<span class="spin"></span> Checking…'; btn.disabled = true; }
    let r; try { r = await AI.check(m); } catch (e) { toast('AI check failed: ' + e.message + ' — offline rules used', 'bad'); r = { conflicts:KB.check(m, m.clauses, nums(m)), source:'offline' }; }
    if (r.source === 'offline') await new Promise(res => setTimeout(res, 700));
    const dismissed = (m.conflicts || []).filter(x => x.status === 'dismissed');
    const fresh = r.conflicts.filter(x => !dismissed.some(d => d.clauseId === x.clauseId && d.quote === x.quote)).map(x => ({ id:uid('f'), ...x, status:'open' }));
    m.conflicts = [...fresh, ...dismissed]; m.conflictsAt = now(); m.conflictsSource = r.source;

/* ============ Clause Studio: writing (only your clauses) and review (only after submit) ============ */
const actLabel = a => a.offset === 0 ? 'Immediately' : `${a.unit === 'days' ? 'Day' : a.unit === 'hours' ? 'Hour' : 'Minute'} ${a.offset}`;
const stepLabel = s => +s.offset === 0 ? 'Immediately on breach' : `${s.offset} ${s.unit} after breach`;
function autogrow(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
UI.exp = UI.exp || {}; UI.activeCmt = null; UI.outlineOpen = false; UI.rTab = 'comments'; UI.brOpen = UI.brOpen || {};

/* Which clauses a person writes: the subtrees assigned to them (owner: everything nobody else was given) */
function writeScope(m) {
  const ids = new Set();
  if (isOwner(m) && ['setup','compliance'].includes(m.stage)) return new Set(m.clauses.map(c => c.id));
  const roots = isOwner(m) ? m.clauses.filter(c => !c.parentId && (!c.assigneeId || c.assigneeId === S.me))
    : m.clauses.filter(c => c.assigneeId === S.me && !ancestors(m, c).some(a => a.assigneeId === S.me));
  roots.forEach(r => { ids.add(r.id); descendants(m, r.id).forEach(d => ids.add(d.id)); });
  return ids;
}
const reviewQueue = m => m.clauses.filter(c => c.status === 'submitted' && c.reviewerId === S.me && c.submittedAt);

function studio(m, r, mode) {
  const scope = mode === 'review' ? (() => { const c = clause(m, r.rid); return c ? new Set([c.id, ...descendants(m, c.id).map(d => d.id)]) : new Set(); })() : writeScope(m);
  const inScope = flat(m).filter(x => scope.has(x.c.id));
  if (!inScope.length) return `<div class="card empty"><div class="h2">${mode === 'review' ? 'Nothing to review' : 'No clauses to write'}</div><p class="muted">${mode === 'review' ? 'This clause is not waiting for your review.' : isOwner(m) ? 'Every clause is assigned to someone else. Follow progress in Assignments.' : 'Nothing is assigned to you in this manual.'}</p></div>`;
  let cid = mode === 'review' ? r.rid : (r.cid || UI.sel[m.id]); if (!scope.has(cid)) cid = inScope[0].c.id; if (mode === 'write') UI.sel[m.id] = cid;

  const list = [c, ...descendants(m, c.id)].filter(k => scope.has(k.id));
  if (mode === 'write') return `<datalist id="units">${['minutes','hours','days','weeks','months','years','%','m','persons','per week'].map(u => `<option value="${u}">`).join('')}</datalist>` + writeLayout(m, c, scope, inScope, list);
  const openC = list.reduce((s, k) => s + k.comments.filter(x => !x.resolved).length, 0);
  const panel = mode === 'review' || openC;
  return `<datalist id="units">${['minutes','hours','days','weeks','months','years','%','m','persons','per week'].map(u => `<option value="${u}">`).join('')}</datalist>
  <div class="studio ${UI.outlineOpen ? 'ol-open' : ''}">
    <div class="ol-scrim" onclick="UI.outlineOpen=false;rerender()"></div>

        ${panel ? reviewPanel(m, c, list, mode) : ''}
      </div>
    </div>
  </div>`;
}

/* ---------- Outline (only the clauses in scope) ---------- */
function outline(m, sel, scope, mode) {
  const n = nums(m), exp = UI.exp[m.id], pre = mode === 'review' ? 'r' : 'c';
  const node = (c, d) => {
    if (!scope.has(c.id)) return '';
    const ch = kids(m, c.id).filter(k => scope.has(k.id)), cm = c.comments.filter(k => !k.resolved).length;
    const od = c.deadline && c.deadline < now() && c.status !== 'approved';
    const deleg = c.assigneeId && c.assigneeId !== S.me ? av(c.assigneeId, 'sm') : '';
    return `<div class="on2 d${Math.min(d, 3)} ${c.id === sel ? 'sel' : ''}" style="padding-left:${6 + d * 16}px">
      ${ch.length ? `<button class="tw ${exp[c.id] ? 'open' : ''}" onclick="event.stopPropagation();A.tw('${m.id}','${c.id}')">${ic('chev', 'sm')}</button>` : '<span class="tw"></span>'}
      <a class="ol-link" onclick="UI.outlineOpen=false;go('#/m/${m.id}/${pre}/${c.id}')"><span class="num">${n[c.id]}</span><span class="tt">${esc(c.title)}</span></a>
      ${cm ? `<span class="flag amber" title="${cm} open comment(s)">${cm}</span>` : ''}${od ? `<span class="flag red" title="Overdue">${ic('clock', 'sm')}</span>` : ''}${deleg}
      <span class="sdot" style="background:${ST[c.status].c}" title="${ST[c.status].l}"></span></div>` + (ch.length && exp[c.id] ? ch.map(k => node(k, d + 1)).join('') : '');
  };
  const roots = flat(m).filter(x => scope.has(x.c.id) && !scope.has(x.c.parentId)).map(x => x.c);
  const p = Math.round(roots.reduce((s, c) => s + prog(m, c), 0) / Math.max(1, roots.length));
  return `<aside class="outline"><div class="ol-head"><div class="row">${ring(p)}<div class="grow"><b>${mode === 'review' ? 'Under review' : 'Your clauses'}</b><div class="xs muted">${scope.size} clause${scope.size > 1 ? 's' : ''} · ${p}% done</div></div><button class="btn xs ghost ol-close" onclick="UI.outlineOpen=false;rerender()">${ic('x', 'sm')}</button></div></div>
    <div class="ol-list">${roots.map(c => node(c, ancestors(m, c).length ? 0 : 0)).join('')}</div></aside>`;
}

/* ---------- Canvas bar ---------- */
function studioBar(m, c, mode, inScope) {
  const n = nums(m), i = inScope.findIndex(x => x.c === c), prev = inScope[i - 1]?.c, next = inScope[i + 1]?.c, pre = mode === 'review' ? 'r' : 'c';
  const menu = [];

    if (canStructure(m, c)) menu.push(`<button onclick="A.addSub('${m.id}','${c.id}')">${ic('plus', 'sm')} Add sub-clause</button>`);

function submitBtn(m, c) {

  if (!mine || !['not_started','in_progress','changes_requested'].includes(c.status)) return c.status === 'submitted' ? `<span class="pill p-amb">In review · ${esc(uname(c.reviewerId).split(' ')[0])}</span>` : c.status === 'approved' ? '<span class="pill p-grn">Approved</span>' : '';
  const b = submitBlockers(m, c), target = c.assigneeId === S.me ? reviewerOf(m, c) : null;

    : `<button class="btn sm acc" onclick="A.submit('${m.id}','${c.id}')">${ic('send', 'sm')} ${target && target !== S.me ? 'Submit to ' + esc(uname(target).split(' ')[0]) : 'Mark as final'}</button>`;

function bookNav(m, lens) {

function bookPages(m, lens, B) {
  const n = nums(m), e = effective(m, lens), D = lens ? dept(lens) : null, draft = m.stage !== 'published';
  const chapters = kids(m, null);
  const total = 3 + chapters.length;
  const style = `--bp:${B.primary};--ba:${B.accent}`;
  const logo = cls => B.logo ? `<img class="${cls}" src="${B.logo}" alt="logo">` : `<div class="${cls} logo-txt">${esc(m.company)}</div>`;
  const head = () => `<header class="pg-head">${logo('pg-logo')}<div class="pg-meta"><b>${esc(m.title)}</b><span>${m.code} · Rev ${m.version}${D ? ' · ' + esc(D.name) + ' edition' : ''}</span></div></header>`;
  const foot = p => `<footer class="pg-foot"><span>${esc(B.conf)}</span><span>${esc(B.footer || m.company)}</span><span>Page ${p} of ${total}</span></footer>`;
  const wm = draft && B.watermark ? '<div class="wm">DRAFT</div>' : '';
  const sheet = (id, p, inner, cls = '') => `<section class="sheet ${cls} f-${B.font}" id="${id}" style="${style}">${wm}${cls.includes('cover') ? '' : head()}<div class="pg-body">${inner}</div>${foot(p)}</section>`;
  const signed = (m.approval?.steps || []).filter(s => s.status === 'approved');
  const meta = [['Document', m.code], ['Revision', m.version], ['Status', draft ? STAGES[stageIdx(m.stage)].l : 'Published'], ['Effective', m.publishedAt ? fmtD(m.publishedAt) : '—'], ['Owner', uname(m.ownerId)]];

  /* cover */
  const coverInner = `
    <div class="cv-top">${logo('cv-logo')}<span class="cv-conf">${esc(B.conf)}</span></div>
    <div class="cv-mid">
      <div class="cv-kicker">${esc(m.company)}</div>
      <h1 class="cv-title">${esc(m.title)}</h1>
      <div class="cv-rule"></div>
      <div class="cv-refs">Prepared in accordance with ${esc(m.references.join(' · '))}</div>
      ${D ? `<div class="cv-edition">${esc(D.name)} edition</div>` : ''}

    <div class="cv-meta">${meta.map(([k, v]) => `<div><span>${k}</span><b>${esc(v)}</b></div>`).join('')}</div>`;
  const cover = `<section class="sheet cover cv-${B.cover} f-${B.font}" id="pg-cover" style="${style}">${wm}<div class="cv-band"></div><div class="cv-inner">${coverInner}</div></section>`;

  /* document control */
  const control = sheet('pg-control', 2, `
    <h2 class="sec-h">Document control</h2>
    <table class="dt"><tbody>${[...meta, ['Title', m.title], ['Company', m.company], ['Normative references', m.references.join(', ')], ['Edition', D ? D.name : 'Corporate baseline']].map(([k, v]) => `<tr><th>${k}</th><td>${esc(v)}</td></tr>`).join('')}</tbody></table>
    <h3 class="sub-h">Approval</h3>
    ${signed.length ? `<div class="sigs">${signed.map(s => `<div class="sig2"><div class="sr">${esc(s.role)}</div><div class="ss">${esc(uname(s.signedBy || s.userId))}</div><div class="sl"></div><div class="sgm">${esc(user(s.signedBy || s.userId)?.title || '')} · ${fmtD(s.actedAt)}</div></div>`).join('')}</div>` : '<p class="muted-p">Approval signatures appear here once the approval chain is completed.</p>'}
    <h3 class="sub-h">Revision history</h3>
    <table class="dt grid"><thead><tr><th>Rev</th><th>Date</th><th>Description</th><th>By</th></tr></thead><tbody>${(m.revisions.length ? m.revisions : [{ version:m.version, ts:m.createdAt, note:'Working draft', by:m.ownerId }]).map(r => `<tr><td>${r.version}</td><td>${fmtD(r.ts)}</td><td>${esc(r.note)}</td><td>${esc(uname(r.by))}</td></tr>`).join('')}</tbody></table>
    ${D ? `<h3 class="sub-h">${esc(D.name)} edition</h3><div class="ed-sum"><div><b>${Object.keys(e.na).length}</b><span>Not applicable</span></div><div><b>${Object.keys(e.tight).length}</b><span>Stricter limits</span></div><div><b>${Object.values(e.adds).flat().length}</b><span>Improvements</span></div></div><p class="muted-p">All other requirements follow the corporate baseline. Department-specific values are marked with <span class="dmark">${esc(D.id)}</span>.</p>` : ''}`);

  /* contents */
  const toc = sheet('pg-toc', 3, `<h2 class="sec-h">Contents</h2><div class="toc">${chapters.map((c, i) => `<a class="tc0 ${e.na[c.id] ? 'na' : ''}" onclick="A.goPage('bk-${c.id}')"><span class="tn">${n[c.id].replace('.0', '')}</span><span class="tt">${esc(c.title)}</span><span class="dots"></span><span class="tp">${4 + i}</span></a>${kids(m, c.id).map(k => `<a class="tc1 ${e.na[k.id] || e.na[c.id] ? 'na' : ''}" onclick="A.goPage('bk-${k.id}')"><span class="tn">${n[k.id]}</span><span class="tt">${esc(k.title)}</span><span class="dots"></span><span class="tp">${4 + i}</span></a>`).join('')}`).join('')}</div>`);

  /* chapters */
  const naBox = (c, v) => `<div class="na2"><b>Not applicable to ${esc(D.name)}</b><span>Approved by ${esc(uname(v.decidedBy))} on ${fmtD(v.decidedAt)}${kids(m, c.id).length ? " · includes all sub-clauses" : ""}</span><i>${esc(v.justification)}</i></div>`;
  const SG = canSuggest(m, lens) && UI.suggest[m.id], SD = !!(D && UI.showDiff[m.id]);
  const ctl = c => {
    if (m.stage !== 'published') {
      if (!['dept_review','approval'].includes(m.stage)) return '';
      const ps = (m.proposals || []).filter(v => v.clauseId === c.id && ['draft','pending','returned'].includes(v.status) && (v.status === 'draft' ? v.requestedBy === S.me : isOwner(m) || v.requestedBy === S.me));
      return ps.map(p => `<button class="sg-pend ${p.status} noprint" onclick="A.reviewReq('${m.id}','${p.id}')">${p.status === 'draft' ? '✎ Your draft' : p.status === 'pending' ? '● ' + esc(p.deptId) + ' revision' : '↩ ' + esc(p.deptId) + ' returned'}</button>`).join('') + (SG ? `<button class="sg-btn noprint" onclick="A.suggest('${m.id}','${c.id}')">${ic('edit', 'sm')} ${ps.some(p => p.deptId === me().deptId) ? 'Edit revision' : 'Propose revision'}</button>` : '');

    return mark + (p ? `<button class="sg-pend ${p.status} noprint" onclick="A.reviewReq('${m.id}','${p.id}')">${p.status === 'pending' ? '● Pending review' : '↩ Returned — see comments'}</button>` : '') + (SG && !(p && p.status === 'pending' && p.kind !== 'edit') ? `<button class="sg-btn noprint" onclick="A.suggest('${m.id}','${c.id}')">${ic('edit', 'sm')} ${p ? 'Edit request' : 'Request variation'}</button>` : '');
  };
  const extras = (c, base) => {
    const lim = c.requirements.length ? `<div class="lim"><div class="lim-h">Limits${D ? ` <span>Corporate${Object.keys(e.tight).length ? ` · ${esc(D.name)}` : ''}</span>` : ''}</div>${c.requirements.map(q => { const t = e.tight[q.id]; return `<div class="lim-r"><span class="lim-l">${esc(q.label)}</span><span class="lim-ty ${q.type}">${q.type === 'max' ? 'Max' : 'Min'}</span><span class="lim-v ${t ? 'struck' : ''}">${q.value} ${esc(q.unit)}</span>${t ? `<span class="lim-d"><span class="dmark">${esc(D.id)}</span> ${t.proposed} ${esc(q.unit)}</span>` : ''}</div>${(q.breach || []).length ? `<div class="lim-br"><span class="lbh">If breached</span>${q.breach.map((s, i) => `<span class="lbs"><b>${i + 1} · ${stepLabel(s)}</b>${s.actions.map(a => esc(a.text) + (a.owner ? ` <i>(${esc(a.owner)})</i>` : '')).join(' · ')}</span>`).join('')}</div>` : ''}`; }).join('')}</div>` : '';
    const showD = SD && c._edit;
    const pts = c.steps.length || (showD && base.steps.length) ? `<div class="pts2"><div class="lim-h">Mandatory</div><ol>${showD ? listDiff(base.steps, c.steps).map(o => o.t === 'eq' ? `<li>${esc(o.a)}</li>` : o.t === 'del' ? `<li><del class="dx">${esc(o.a)}</del></li>` : o.t === 'ins' ? `<li><ins class="ix">${esc(o.b)}</ins></li>` : `<li>${o.d.inline}</li>`).join('') : c.steps.map(p => `<li>${esc(p)}</li>`).join('')}</ol></div>` : '';
    const acts = c.actions.length ? `<div class="acts2"><div class="lim-h">Response timeline</div>${c.actions.slice().sort((a, b) => KB.toHours(a.offset, a.unit) - KB.toHours(b.offset, b.unit)).map(a => `<div class="ar"><span class="aw">${actLabel(a)}</span><span class="ad"></span><span class="aa">${esc(a.action)}${a.owner ? `<em>${esc(a.owner)}</em>` : ''}</span></div>`).join('')}</div>` : '';
    const adds = (e.adds[c.id] || []).map(v => `<div class="add2"><span class="dmark">${esc(D.id)}</span> ${esc(v.text)}</div>`).join('');
    return lim + pts + acts + adds;
  };
  const bodyOf = (ec, c) => SD && ec._edit ? `<p class="dfp">${wordDiff(c.body, ec.body).inline}</p>` : (ec.html ? ec.html : bodyHTML(ec.body));
  const clauseHTML = (c, d) => {
    const ec = eclause(c, e);
    const head = `<div class="cl-h d${Math.min(d, 3)}" id="bk-${c.id}"><span class="cl-n">${n[c.id]}</span><span class="cl-t">${esc(c.title)}${ctl(c)}</span></div>`;
    if (e.na[c.id]) return `<div class="cl">${head}${naBox(c, e.na[c.id])}</div>`;
    return `<div class="cl ${SG ? 'sgable' : ''}">${head}<div class="cl-b">${bodyOf(ec, c)}${extras(ec, c)}</div>${kids(m, c.id).map(k => clauseHTML(k, d + 1)).join("")}</div>`;
  };
  const chaps = chapters.map((c, i) => { const ec = eclause(c, e); return sheet("ch-" + c.id, 4 + i, `<div class="opener" id="bk-${c.id}"><div class="op-n">${String(i + 1).padStart(2, "0")}</div><div class="grow"><div class="op-k">Section ${n[c.id]}</div><h2 class="op-t">${esc(c.title)}</h2><div class="op-ctl">${ctl(c)}</div></div></div>
    ${e.na[c.id] ? naBox(c, e.na[c.id]) : `<div class="cl-b lead">${bodyOf(ec, c)}${extras(ec, c)}</div>${kids(m, c.id).map(k => clauseHTML(k, 1)).join("")}`}`, "chap"); });
  return cover + control + toc + chaps.join('');
}

Object.assign(A, {
  goPage(id) { document.getElementById(id)?.scrollIntoView({ behavior:'smooth', block:'start' }); },
  brandSet(k, v, silent) { S.settings.brand = { ...brand(), [k]:v }; save(); if (!silent) rerender(); },
  logo(inp) {
    const f = inp.files[0]; if (!f) return;
    if (f.size > 4e6) return toast('Logo must be under 4 MB', 'bad');
    const r = new FileReader();
    r.onload = () => {
      if (f.type === 'image/svg+xml') { A.brandSet('logo', r.result); return toast('Logo updated', 'good'); }
      const img = new Image(); img.onload = () => {
        const s = Math.min(1, 600 / img.width, 300 / img.height); const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        A.brandSet('logo', cv.toDataURL('image/png')); toast('Logo updated', 'good');
      }; img.src = r.result;
    };
    r.readAsDataURL(f);
  },
});

function orgTree(period, dScore) {
  const ceo = deptHead('EXE'), co = score(period);
  const node = (cls, title, sub, s, o, onclick, extra = '') => `<div class="onode ${cls} ${UI.cf.dept && onclick.includes(`'${UI.cf.dept}'`) ? 'sel' : ''}" onclick="${onclick}" style="--sc:${scoreCol(s)}"><div class="row"><div class="grow" style="min-width:0"><div class="ot">${title}</div><div class="os">${sub}</div></div><div class="opct">${s == null ? '—' : Math.round(s) + '%'}</div></div><div class="bar mt8" style="height:5px"><i style="width:${s ?? 0}%;background:${scoreCol(s)}"></i></div>${o ? `<div class="obad">${ic('alert', 'sm')} ${o} live breach${o > 1 ? 'es' : ''}</div>` : '<div class="ook">No live breaches</div>'}${extra}</div>`;
  const known = DIVS.flatMap(d => d.depts), others = S.departments.filter(d => !known.includes(d.id)).map(d => d.id);
  const divs = [...DIVS, ...(others.length ? [{ id:'D-OTH', name:'Other units', depts:others }] : [])];
  return `<div class="org"><ul><li>${node('root', esc(S.settings.company), `CEO · ${esc(uname(ceo))}`, score(period), period.filter(x => x.state === 'overdue').length, "UI.cf.dept='';rerender()")}
    <ul>${divs.map(dv => { const xs = period.filter(x => dv.depts.includes(x.dept)); return `<li>${node('div', dv.name, `${dv.depts.length} departments`, score(xs), xs.filter(x => x.state === 'overdue').length, `UI.cf.dept='div:${dv.id}';rerender()`)}
      <div class="oleaves">${dv.depts.filter(dept).map(id => { const xs2 = period.filter(x => x.dept === id); const e = stdManual() ? effective(stdManual(), id) : { na:{}, tight:{} }; const nv = Object.keys(e.na).length + Object.keys(e.tight).length;
        return node('leaf', esc(dept(id).name), `${esc(uname(deptHead(id)))}${nv ? ` · <span title="Approved department variations">${nv} variation${nv > 1 ? 's' : ''}</span>` : ''}`, dScore(id), xs2.filter(x => x.state === 'overdue').length, `UI.cf.dept='${id}';rerender()`); }).join('')}</div></li>`; }).join('')}</ul></li></ul></div>`;
}
function breachCard(x) {
