  return `<div class="bcard ${x.state}">
    <div class="row gap12">${modTile(mo)}<div class="grow" style="min-width:0"><div class="row wrap gap4"><b class="mono small">${esc(x.id)}</b><span class="small" style="font-weight:600">${esc(x.title)}</span></div>
      <div class="xs muted">${esc(mo.name)} · ${esc(dept(x.dept).name)}${x.area ? ' · ' + esc(x.area) : ''}</div></div><span class="badge ${STATE_B[x.state][0]}">${STATE_B[x.state][1]}</span></div>
    <div class="small mt8">${whereTxt(x)}</div>
    ${whereBar(x)}${respPlan(x)}
    <div class="row wrap mt8"><span class="xs muted">Standard: <a href="${L(x.lim.m, x.lim.c)}">${esc(x.lim.m.code)} §${n} ${esc(x.lim.c.title)}</a> — ${esc(x.lim.q.label)} ${limTxt(x.lim)}${x.lim.tightened ? ` <span class="badge b-orange plain">${esc(x.dept)} edition (corporate ${x.lim.base} ${esc(x.lim.unit)})</span>` : ''}</span>
      <span class="right row gap4">${I.notified[x.id] ? `<span class="xs faint">Notified ${rel(I.notified[x.id])}</span>` : `<button class="btn xs" onclick="A.ccNotify('${x.id}')">${ic('bell', 'sm')} Notify ${esc(uname(deptHead(x.dept)).split(' ')[0])}</button>`}</span></div>
  </div>`;
}
function respPlan(x) {
  const st = x.lim.q.breach || []; if (!st.length || x.state !== 'overdue') return '';
  const over = (x.el || 0) - (x.lim.hours || 0);
  return `<div class="rplan"><div class="xs muted mb8" style="margin-bottom:4px">Required response per ${esc(x.lim.m.code)}</div>${st.map((s, i) => { const h = KB.toHours(+s.offset, s.unit), due = over >= h;
    return `<div class="rps ${due ? 'due' : ''}"><span class="rpn">${i + 1}</span><span class="grow small"><b>${stepLabel(s)}</b> — ${s.actions.map(a => esc(a.text) + (a.owner ? ` <i class="muted">(${esc(a.owner)})</i>` : '')).join('; ')}</span>${due ? '<span class="pill p-red">due now</span>' : `<span class="xs muted">in ${fmtDur(h - over)}</span>`}</div>`; }).join('')}</div>`;
}
function heatmap(period) {
  const I = integ();
  return `<table class="heat2"><thead><tr><th></th>${MODS.map(mo => `<th title="${mo.name}"><span class="mico sm" style="background:${mo.color}">${ic(mo.icon, 'sm')}</span></th>`).join('')}<th>Total</th></tr></thead><tbody>
    ${S.departments.map(d => { const row = period.filter(x => x.dept === d.id); return `<tr><td class="hn">${esc(d.name)}</td>${MODS.map(mo => { const xs = row.filter(x => x.mod === mo.id); const na = xs.length && xs.every(x => x.state === 'na'); const s = score(xs);
      return `<td><button class="hc" style="background:${na ? 'repeating-linear-gradient(135deg,var(--surface2) 0 5px,var(--line2) 5px 10px)' : heatBg(s)};color:${s == null ? 'var(--faint)' : '#fff'}" ${xs.length ? `onclick="A.ccDrill('${d.id}','${mo.id}')"` : 'disabled'} title="${esc(d.name)} · ${mo.name}: ${na ? 'Not applicable (approved)' : s == null ? 'no records' : s + '%'}">${na ? 'N/A' : s == null ? '·' : Math.round(s)}</button></td>`; }).join('')}<td><b style="color:${scoreCol(score(row))}">${score(row) == null ? '—' : Math.round(score(row)) + '%'}</b></td></tr>`; }).join('')}</tbody></table>
    <div class="legend mt12"><span><i style="background:${heatBg(98)}"></i>Excellent</span><span><i style="background:${heatBg(85)}"></i>Watch</span><span><i style="background:${heatBg(65)}"></i>Non-compliant</span><span><i style="background:var(--line2)"></i>N/A approved / no activity</span></div>`;
}
function controlTable(scoped) {
  const rows = CRULES.map(rule => { const xs = scoped.filter(x => x.rule.id === rule.id); const base = limitFor(rule, ''); return { rule, xs, base, s:score(xs) }; }).filter(r => r.base);
  return `<table class="tbl"><thead><tr><th>Control point</th><th>Standard clause</th><th>Corporate limit</th><th>Department editions</th><th>Checked</th><th style="width:180px">Compliance</th></tr></thead><tbody>
    ${rows.map(({ rule, xs, base, s }) => { const mo = mod(rule.mod), n = nums(base.m)[base.c.id]; const ov = S.departments.map(d => ({ d, l:limitFor(rule, d.id) })).filter(x => x.l && (x.l.tightened || x.l.na));
      return `<tr class="click" onclick="A.ccDrill('','${rule.mod}','${rule.id}')"><td><div class="row">${modTile(mo)}<div><b class="small">${esc(rule.name)}</b><div class="xs muted">${esc(mo.name)}</div></div></div></td><td class="small"><a href="${L(base.m, base.c)}" onclick="event.stopPropagation()">${esc(base.m.code)} §${n}</a><div class="xs muted">${esc(base.c.title)}</div></td><td><span class="tpill ${base.type}">${base.type.toUpperCase()}</span> <b>${base.base}</b> ${esc(base.unit)}</td>
        <td>${ov.map(x => `<span class="badge ${x.l.na ? 'b-gray' : 'b-orange'} plain" style="margin:1px">${esc(x.d.id)}: ${x.l.na ? 'N/A' : x.l.value + ' ' + esc(x.l.unit)}</span>`).join('') || '<span class="xs faint">Baseline everywhere</span>'}</td>
        <td class="mono small">${xs.length}</td><td><div class="row"><div class="bar grow"><i style="width:${s ?? 0}%;background:${scoreCol(s)}"></i></div><b class="mono small" style="color:${scoreCol(s)};width:42px;text-align:right">${s == null ? '—' : Math.round(s) + '%'}</b></div></td></tr>`; }).join('')}</tbody></table>`;

function ccStrip() {
  try {
    const c = cube(), s = score(c.period), o = c.period.filter(x => x.state === 'overdue');
    const worst = S.departments.map(d => ({ d, s:score(c.period.filter(x => x.dept === d.id)) })).filter(x => x.s != null).sort((a, b) => a.s - b.s)[0];
    return `<a class="ccstrip" href="#/compliance"><span class="mico" style="background:${scoreCol(s)}">${ic('shieldck')}</span><div class="grow"><div class="eyebrow">Live compliance · ${esc(integ().system)}</div><div class="row wrap" style="margin-top:4px"><b class="h2" style="color:${scoreCol(s)}">${s}%</b><span class="small muted">${c.period.length} records checked against the standard</span></div></div>${o.length ? `<span class="badge b-red">${o.length} live breaches</span>` : ''}${worst ? `<span class="small muted">Lowest: <b>${esc(worst.d.name)}</b> ${Math.round(worst.s)}%</span>` : ''}<span class="btn sm">Open command center ${ic('chev', 'sm')}</span></a>`;
  } catch (e) { return ''; }
}

/* ---------- Actions ---------- */
Object.assign(A, {
  async ccSync(btn) { if (btn) { btn.innerHTML = '<span class="spin"></span> Syncing…'; btn.disabled = true; } await new Promise(r => setTimeout(r, 900)); FEED = null; const f = feed(); save(); rerender(); toast(`Synced ${f.records.length} records from ${integ().system}`, 'good'); },
  ccNotify(id) { const x = cube().all.find(r => r.id === id); if (!x) return; const h = deptHead(x.dept);
    notify(h, `Compliance breach in ${dept(x.dept).name}: ${x.id} ${x.title} — ${x.rule.name} (${limTxt(x.lim)} per ${x.lim.m.code} §${nums(x.lim.m)[x.lim.c.id]}). ${x.state === 'overdue' ? 'Overdue now.' : ''}`, '#/compliance', 'escalation');
    integ().notified[id] = now(); log(null, `notified ${uname(h)} about compliance breach ${id}`, 'escalation'); commit(`${uname(h)} notified`); },
  ccToggle(id) { const I = integ(); I.disabled = I.disabled.includes(id) ? I.disabled.filter(x => x !== id) : [...I.disabled, id]; FEED = null; save(); rerender(); },
  ccDrill(deptId, modId, ruleId) {
    const xs = cube().period.filter(x => (!deptId || x.dept === deptId) && (!modId || x.mod === modId) && (!ruleId || x.rule.id === ruleId)).sort((a, b) => ['overdue','breach','risk','due','open','ok','na'].indexOf(a.state) - ['overdue','breach','risk','due','open','ok','na'].indexOf(b.state));
    const mo = modId ? mod(modId) : null, s = score(xs);
    modal({ wide:true, title:`${deptId ? esc(dept(deptId).name) + ' · ' : ''}${ruleId ? esc(CRULES.find(r => r.id === ruleId).name) : mo ? mo.name : 'Records'}`, icon:mo ? modTile(mo) : '',
      body:`<div class="row gap16 mb16"><div class="h1" style="color:${scoreCol(s)}">${s == null ? '—' : s + '%'}</div><div class="small muted">${xs.length} records · ${xs.filter(x => x.state === 'overdue').length} live breaches · ${xs.filter(x => x.state === 'breach').length} closed late / failed</div></div>
      <div class="col gap8">${xs.slice(0, 80).map(x => `<div class="drow"><span class="badge ${STATE_B[x.state][0]}" style="min-width:96px;justify-content:center">${STATE_B[x.state][1]}</span><div class="grow" style="min-width:0"><div class="small"><b class="mono">${esc(x.id)}</b> ${esc(x.title)} <span class="muted">· ${esc(dept(x.dept).id)} · ${esc(x.rule.name)}</span></div>${x.state === 'na' ? '<div class="xs muted">Clause approved as not applicable for this department</div>' : `<div class="xs muted">${whereTxt(x)}</div>${whereBar(x)}`}</div></div>`).join('') || '<div class="empty">No records.</div>'}</div>` });
  },
  ccBrief() {
    const { period } = cube(), sc = score(period), over = period.filter(x => x.state === 'overdue');
    const ds = S.departments.map(d => ({ d, s:score(period.filter(x => x.dept === d.id)), o:period.filter(x => x.dept === d.id && x.state === 'overdue').length })).filter(x => x.s != null).sort((a, b) => a.s - b.s);
    const ms = MODS.map(mo => ({ mo, s:score(period.filter(x => x.mod === mo.id)) })).filter(x => x.s != null).sort((a, b) => a.s - b.s);
    const worstRule = CRULES.map(r => ({ r, s:score(period.filter(x => x.rule.id === r.id)), n:period.filter(x => x.rule.id === r.id && BAD.has(x.state)).length })).filter(x => x.s != null).sort((a, b) => b.n - a.n)[0];
    const top = over.sort((a, b) => b.frac - a.frac)[0];
    const tight = S.departments.filter(d => stdManual() && Object.keys(effective(stdManual(), d.id).tight).length);
    modal({ title:'Executive brief', icon:`<span class="mico" style="background:var(--accent)">${ic('sparkles')}</span>`, wide:true, body:`<div class="brief">
      <p class="lead2">Overall compliance with <b>${esc(stdManual().code)}</b> is <b style="color:${scoreCol(sc)}">${sc}%</b> over the last ${UI.cf.days} days, with <b>${over.length}</b> live breaches open right now.</p>
      <h4>Where to act</h4><ul>
        ${ds[0] ? `<li><b>${esc(ds[0].d.name)}</b> is the lowest-scoring department at <b>${ds[0].s}%</b>${ds[0].o ? ` with ${ds[0].o} live breach${ds[0].o > 1 ? 'es' : ''}` : ''}.</li>` : ''}

/* ============ Process-driven manual workspace: one screen per stage, one view per role ============ */
UI.dsel = UI.dsel || {}; UI.asgF = UI.asgF || {};

function roleIn(m) {

  if (m.stage === 'drafting' && (writeScope(m).size || reviewQueue(m).length)) return 'writer';
  if (m.stage === 'dept_review' && m.deptReview && m.deptReview.items.some(i => i.deptId === me().deptId)) return 'deptrev';
  if (m.stage === 'approval' && m.approval && m.approval.steps.some(s => s.userId === S.me)) return 'approver';
  if (m.stage === 'published') return 'deptpub';
  return 'viewer';
}

function viewManual(m, r) {
  const legacy = { dept:'dept_review', approval:'approval', variations:'published', conflicts:'compliance' };
  if (r.tab && legacy[r.tab]) { r.stage = legacy[r.tab]; r.tab = null; }
  if (r.tab === 'clauses') r.tab = null;
  const role = roleIn(m);
  if (r.tab === 'book') return mHead(m, role, 'book') + tabBook(m);
  if (r.tab === 'activity') return mHead(m, role, 'activity') + tabActivity(m);
  if (role === 'owner') {
    if (r.cid && ['setup','compliance'].includes(m.stage)) return mHead(m, role) + `<div class="subnav"><a href="${L(m)}">${ic('chev', 'sm flip')} Back to ${STAGES[stageIdx(m.stage)].l}</a></div>` + studio(m, r, 'write');

function chainOf(m, c) { const ch = [m.ownerId]; [...ancestors(m, c), c].forEach(x => { if (x.assigneeId && ch[ch.length - 1] !== x.assigneeId) ch.push(x.assigneeId); }); return ch; }

  const rows = flat(m).filter(({ c }) => !f || responsibleFor(m, c) === f || c.assigneeId === f).map(({ c, d }) => { const di = dueInfo(c.deadline, c.status === 'approved'), ch = chainOf(m, c);

      <td><div class="row">${av(responsibleFor(m, c), 'sm')}<span class="small">${esc(uname(responsibleFor(m, c)))}</span>${c.assigneeId ? '' : '<span class="xs faint">(with parent)</span>'}</div></td>

    <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Clause</th><th>Writer</th><th>Assigned by</th><th>Deadline</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;

/* ================= 3 · Compliance check ================= */

    if (!mk.quote) return;

    while ((n = tw.nextNode())) { if (n.parentNode.closest && n.parentNode.closest('mark')) { full += n.data; nodes.push({ n, s:full.length - n.data.length, skip:true }); continue; } nodes.push({ n, s:full.length }); full += n.data; }
    const q = mk.quote.replace(/\s+/g, ' ').trim();
    let at = full.indexOf(mk.quote); let len = mk.quote.length;
    if (at < 0) { const norm = full.replace(/\s/g, ' '); at = norm.toLowerCase().indexOf(q.toLowerCase()); len = q.length; }
    if (at < 0) return;
    const end = at + len;
    nodes.forEach(({ n, s, skip }) => {
      const e = s + n.data.length; if (skip || e <= at || s >= end) return;
      const a = Math.max(0, at - s), b = Math.min(n.data.length, end - s);
      const mid = n.splitText(a); mid.splitText(b - a);
      const w = document.createElement('mark'); w.className = mk.cls; w.dataset.k = mk.id; if (mk.title) w.title = mk.title;
      w.setAttribute('onclick', `A.focusMark('${mk.id}','${mk.kind}')`); mid.replaceWith(w); w.appendChild(mid);
    });
  });
  return root.innerHTML;
}

/* ---------- Write layout ---------- */

  const ed = canEdit(m, c) && (!c.assigneeId || c.assigneeId === S.me || m.stage === 'setup');

        ['Tools', mi('AI draft / improve', `A.aiDraft('${m.id}','${c.id}',document.getElementById('rte-ai'))`) + mi('Compliance check', `A.lint('${m.id}','${c.id}');toast('Checked against ' + manual('${m.id}').references.join(', '))`) + mi('Word count', 'A.rcount()')],
        ['Help', mi('Keyboard shortcuts', 'A.rhelp()') + mi('Writing tips', 'A.rtips()')]].map(([l, items]) => `<div class="rm"><button class="rmb" ${dis && l !== 'View' && l !== 'Help' ? dis : ''} onmousedown="event.preventDefault()" onclick="A.rmenu(this)">${l}</button><div class="rmd">${items}</div></div>`).join('')}

      <div class="pp-row"><span class="pp-l">Reviewer</span><span class="pp-v">${rv ? av(rv, 'sm') + `<span>${esc(uname(rv))}</span>` : '<span class="muted">Owner sign-off</span>'}</span></div>

    </div>`;

/* ---------- Editor behaviour ---------- */
function bindRte() {
  const ed = $('.rte-body[contenteditable="true"]'); if (!ed) return;
  const [mid, cid] = [ed.dataset.m, ed.dataset.c];
  let t = null;
  const changed = () => {
    const [m, c] = MC(mid, cid); c.html = sanitizeHTML(ed.innerHTML); c.body = htmlText(ed); touchClause(c);
    const wc = $('#rte-wc'); if (wc) wc.textContent = (c.body.match(/\S+/g) || []).length + ' words';
    const sv = $('#rte-sv'); if (sv) sv.textContent = 'Saving…'; clearTimeout(t); t = setTimeout(() => { save(); if ($('#rte-sv')) $('#rte-sv').textContent = 'All changes saved'; }, 400);
  };
  ed.addEventListener('input', changed);
  ed.addEventListener('blur', () => { A.rsave(); setTimeout(() => { if (!document.activeElement || !document.activeElement.closest('.rte')) A.lint(mid, cid); }, 150); });
  ed.addEventListener('paste', e => { const h = e.clipboardData.getData('text/html'), p = e.clipboardData.getData('text/plain'); e.preventDefault(); document.execCommand('insertHTML', false, h ? sanitizeHTML(h) : esc(p).replace(/\n/g, '<br>')); });
  ed.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); A.rlink(); } if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'h') { e.preventDefault(); A.rfind(); } });
  ed._changed = changed;
  if (!window._rteSel) { window._rteSel = true; document.addEventListener('selectionchange', rteTbState); document.addEventListener('mousedown', e => { if (!e.target.closest('.rm')) A.rclose(); }); }
}
function rteTbState() {
  const ed = $('.rte-body[contenteditable="true"]'); if (!ed) return;
  const s = getSelection(); if (!s.rangeCount || !ed.contains(s.anchorNode)) return;
  RTE_RANGE = s.getRangeAt(0).cloneRange();
  $$('.rte-tb .tb[data-cmd]').forEach(b => { try { b.classList.toggle('on', document.queryCommandState(b.dataset.cmd)); } catch (e) {} });
}
const _mount0 = mountManual;
mountManual = function (m, r) { _mount0(m, r); bindRte(); const rb = $$('.wsheet.review .docbody[data-c], .rte-body[contenteditable="false"]'); };
Object.assign(A, {
  rsave() { const s = getSelection(), ed = $('.rte-body'); if (s.rangeCount && ed && ed.contains(s.anchorNode)) RTE_RANGE = s.getRangeAt(0).cloneRange(); },
  rrestore() { const ed = $('.rte-body[contenteditable="true"]'); if (!ed) return null; ed.focus(); if (RTE_RANGE && ed.contains(RTE_RANGE.startContainer)) { const s = getSelection(); s.removeAllRanges(); s.addRange(RTE_RANGE); } return ed; },
  rx(cmd, val) {
    const ed = A.rrestore(); if (!ed) return;
    if (cmd === 'formatBlock') document.execCommand('formatBlock', false, '<' + (val || 'p') + '>');
    else if (cmd === 'table') document.execCommand('insertHTML', false, '<table><thead><tr><th>Item</th><th>Requirement</th><th>Owner</th></tr></thead><tbody><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr></tbody></table><p><br></p>');
    else if (cmd === 'hilite') document.execCommand('hiliteColor', false, '#FFF1A8');
    else if (cmd === 'note') document.execCommand('insertHTML', false, '<blockquote><strong>Note:</strong> </blockquote><p><br></p>');
    else if (cmd === 'date') document.execCommand('insertText', false, fmtD(now()));
    else document.execCommand(cmd, false, val || null);
    ed._changed && ed._changed(); rteTbState();
  },
  rmenu(btn) { const w = btn.parentElement, o = w.classList.contains('open'); A.rclose(); if (!o) w.classList.add('open'); },
  rclose() { $$('.rm.open').forEach(x => x.classList.remove('open')); },
  rfull() { const r = $('#rte'); r.classList.toggle('full'); document.body.classList.toggle('rte-full', r.classList.contains('full')); },
  rprops() { UI.propsHidden = !UI.propsHidden; rerender(); },
  rcount() { const ed = $('.rte-body'); const tx = ed ? htmlText(ed) : ''; modal({ title:'Word count', body:`<div class="grid3"><div class="note"><div class="eyebrow">Words</div><div class="h2 mt8">${(tx.match(/\S+/g) || []).length}</div></div><div class="note"><div class="eyebrow">Characters</div><div class="h2 mt8">${tx.length}</div></div><div class="note"><div class="eyebrow">“shall” statements</div><div class="h2 mt8">${(tx.match(/\bshall\b/gi) || []).length}</div></div></div>` }); },
  rlink() {
    A.rsave(); const sel = getSelection().toString();
    ask({ title:'Insert link', label:'URL (https://…)', value:'https://', ok:'Insert', required:true }, url => { const ed = A.rrestore(); if (!ed) return; if (!/^(https?:|mailto:)/i.test(url)) url = 'https://' + url; if (sel) document.execCommand('createLink', false, url); else document.execCommand('insertHTML', false, `<a href="${esc(url)}">${esc(url)}</a>`); ed._changed && ed._changed(); });
  },
  rfind() {
    A.rsave();
    modal({ title:'Find & replace', body:`<div class="field"><label class="lbl">Find</label><input class="input" id="rf-f" autofocus></div><div class="field"><label class="lbl">Replace with</label><input class="input" id="rf-r"></div><div class="xs muted" id="rf-n"></div>`, foot:`<button class="btn ghost" onclick="closeModal()">Close</button><button class="btn pri" id="rf-ok">Replace all</button>` });
    const count = () => { const f = $('#rf-f').value, tx = htmlText($('.rte-body')); $('#rf-n').textContent = f ? `${tx.split(f).length - 1} match(es)` : ''; };
    $('#rf-f').oninput = count;
    $('#rf-ok').onclick = () => { const f = $('#rf-f').value, r2 = $('#rf-r').value, ed = $('.rte-body[contenteditable="true"]'); if (!f || !ed) return; let k = 0; const tw = document.createTreeWalker(ed, NodeFilter.SHOW_TEXT); let nd; while ((nd = tw.nextNode())) if (nd.data.includes(f)) { k += nd.data.split(f).length - 1; nd.data = nd.data.split(f).join(r2); } ed._changed && ed._changed(); closeModal(); toast(`Replaced ${k} occurrence${k === 1 ? '' : 's'}`, 'good'); };
  },
  rhelp() { modal({ title:'Keyboard shortcuts', body:`<table class="tbl">${[['Bold','Ctrl B'],['Italic','Ctrl I'],['Underline','Ctrl U'],['Undo / Redo','Ctrl Z / Ctrl Y'],['Insert link','Ctrl K'],['Find & replace','Ctrl H'],['Search the workspace','Ctrl K (outside the editor)']].map(([a, b]) => `<tr><td>${a}</td><td><kbd>${b}</kbd></td></tr>`).join('')}</table>` }); },
  rtips() { modal({ title:'Writing tips', body:`<ul class="small" style="line-height:1.8;margin:0;padding-left:18px"><li>Use <b>shall</b> for mandatory requirements, <b>should</b> for recommendations.</li><li>Put numeric limits (MIN/MAX) in the clause panel, not in the text — the system checks them live.</li><li>Use the mandatory points for steps that must always happen.</li><li>Keep one requirement per sentence so reviewers can comment precisely.</li></ul>` }); },
  setDeadline(mid, cid, v) { const [m, c] = MC(mid, cid); c.deadline = fromIso(v); c.history.push({ ts:now(), userId:S.me, text:'Deadline set to ' + fmtD(c.deadline) }); if (c.assigneeId && c.assigneeId !== S.me && m.stage !== 'setup') notify(c.assigneeId, `${uname(S.me)} changed the deadline of ${nums(m)[c.id]} “${c.title}” to ${fmtD(c.deadline)}`, '#/writing', 'reminder'); commit('Deadline updated'); },
});

boot();
